<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容运营管线全景框架</title>
<style>
  /* ========== Brand ========== */
  :root {
    --bg: #0f0f1a;
    --bg2: #1a1a2e;
    --bg3: #252545;
    --gold: #c8a03c;
    --gold-dim: #a07820;
    --text: #e8e6e3;
    --text-dim: #888;
    --border: #2a2a4a;
    --card: #1e1e38;
    --blue-accent: #3a6ea5;
    --red: #e74c3c;
    --green: #27ae60;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ========== Header ========== */
  .header {
    background: linear-gradient(135deg, var(--bg2) 0%, #12122a 100%);
    border-bottom: 2px solid var(--gold);
    padding: 20px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
  }
  .header h1 small {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0;
    margin-left: 12px;
  }
  .header-stats {
    display: flex;
    gap: 16px;
    font-size: 12px;
  }
  .header-stats span {
    background: var(--bg3);
    padding: 4px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .header-stats i { color: var(--gold); margin-right: 4px; }

  /* ========== Search ========== */
  .search-bar {
    padding: 12px 30px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 76px;
    z-index: 99;
  }
  .search-bar input {
    width: 100%;
    max-width: 600px;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .search-bar input:focus { border-color: var(--gold); }
  .search-bar input::placeholder { color: var(--text-dim); }

  /* ========== Layout ========== */
  .app {
    display: flex;
    height: calc(100vh - 130px);
  }
  .tree-panel {
    width: 380px;
    min-width: 380px;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    padding: 16px 0 40px;
  }
  .detail-panel {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
  }

  /* ========== Tree ========== */
  .tree { list-style: none; padding-left: 0; }
  .tree li { position: relative; }
  .tree-node {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px 6px 8px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all .15s;
    user-select: none;
    font-size: 13px;
    line-height: 1.4;
    position: relative;
  }
  .tree-node:hover { background: rgba(200,160,60,.08); }
  .tree-node.active {
    background: rgba(200,160,60,.15);
    border-left-color: var(--gold);
  }
  .tree-node .icon {
    flex-shrink: 0;
    width: 20px;
    text-align: center;
    font-size: 14px;
    opacity: .7;
  }
  .tree-node .label { flex: 1; min-width: 0; }
  .tree-node .badge {
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 8px;
    background: var(--bg3);
    color: var(--text-dim);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tree-node .badge.py { color: #4ec9b0; border-color: #4ec9b0; }
  .tree-node .badge.key { color: var(--gold); border-color: var(--gold); }
  .tree-node .badge.platform { color: var(--blue-accent); border-color: var(--blue-accent); }
  .tree-node .badge.count { font-size: 10px; }
  .toggle {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--text-dim);
    transition: transform .2s;
  }
  .toggle.closed { transform: rotate(-90deg); }
  .children { overflow: hidden; transition: max-height .25s ease; }
  .children.collapsed { max-height: 0 !important; }
  .depth-1 > .tree-node { padding-left: 28px; font-size: 12.5px; }
  .depth-2 > .tree-node { padding-left: 48px; font-size: 12px; }
  .depth-3 > .tree-node { padding-left: 68px; font-size: 11.5px; }
  .depth-4 > .tree-node { padding-left: 88px; font-size: 11px; }

  /* ========== Detail Panel ========== */
  .detail-panel h2 {
    font-size: 20px;
    color: var(--gold);
    margin-bottom: 6px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  .detail-panel .subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .detail-section {
    margin-bottom: 20px;
  }
  .detail-section h3 {
    font-size: 14px;
    color: var(--gold-dim);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .detail-section h3::before {
    content: '';
    display: inline-block;
    width: 3px;
    height: 14px;
    background: var(--gold);
    border-radius: 2px;
  }
  .detail-section p, .detail-section li {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    opacity: .9;
  }
  .detail-section ul { padding-left: 20px; }
  .detail-section li { margin-bottom: 3px; }
  .detail-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .detail-table th {
    text-align: left;
    padding: 6px 10px;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    color: var(--gold-dim);
  }
  .detail-table td {
    padding: 5px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .detail-table tr:hover td { background: rgba(200,160,60,.04); }
  .detail-tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 11px;
    margin: 1px 2px;
  }
  .detail-tag.py { background: rgba(78,201,176,.15); color: #4ec9b0; border: 1px solid rgba(78,201,176,.3); }
  .detail-tag.platform { background: rgba(58,110,165,.15); color: #5a9fd5; border: 1px solid rgba(58,110,165,.3); }
  .detail-tag.core { background: rgba(200,160,60,.15); color: var(--gold); border: 1px solid rgba(200,160,60,.3); }
  .detail-tag.updated { background: rgba(39,174,96,.15); color: #27ae60; border: 1px solid rgba(39,174,96,.3); }
  .code-block {
    background: rgba(0,0,0,.3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 12px;
    overflow-x: auto;
    margin: 8px 0;
    line-height: 1.6;
  }
  .iter-timeline {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-left: 12px;
    border-left: 2px solid var(--gold-dim);
  }
  .iter-item {
    font-size: 12px;
    display: flex;
    gap: 10px;
    align-items: baseline;
  }
  .iter-date {
    color: var(--gold);
    font-weight: 600;
    flex-shrink: 0;
    min-width: 80px;
  }
  .iter-desc { color: var(--text); opacity: .85; }
  .empty-detail {
    color: var(--text-dim);
    text-align: center;
    padding: 60px 20px;
  }
  .empty-detail .big-icon { font-size: 48px; margin-bottom: 16px; opacity: .3; }
  .empty-detail p { font-size: 14px; line-height: 1.8; }

  /* ========== Scrollbar ========== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  /* ========== Responsive ========== */
  @media (max-width: 768px) {
    .app { flex-direction: column; height: auto; }
    .tree-panel { width: 100%; min-width: 0; max-height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
    .detail-panel { min-height: 50vh; }
    .header h1 { font-size: 17px; }
    .header-stats span { font-size: 10px; padding: 2px 8px; }
  }

  /* highlight search */
  .hl { background: rgba(200,160,60,.3); border-radius: 2px; padding: 0 2px; }
</style>
</head>
<body>

<!-- ========== Header ========== -->
<div class="header">
  <div>
    <h1>📦 内容运营管线 <small>美好需要创造 · AI提效实战派</small></h1>
  </div>
  <div class="header-stats">
    <span>📜 35+ 脚本</span>
    <span>🌐 11 平台</span>
    <span>🔍 6 引擎</span>
    <span>🧠 5 技能</span>
    <span>📅 24天迭代</span>
  </div>
</div>

<!-- ========== Search ========== -->
<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍 搜索脚本名称、关键词、功能…（如: publish、视频、知乎、抖音）" oninput="filterTree(this.value)">
</div>

<!-- ========== App ========== -->
<div class="app" id="app">
  <div class="tree-panel" id="treePanel"></div>
  <div class="detail-panel" id="detailPanel">
    <div class="empty-detail" id="emptyDetail">
      <div class="big-icon">🗺️</div>
      <p><strong>点击左侧任一节点</strong><br>查看详细说明、文件信息、迭代记录</p>
      <p style="font-size:12px;color:var(--text-dim);margin-top:12px;">或使用搜索框快速定位</p>
    </div>
    <div id="detailContent" style="display:none;"></div>
  </div>
</div>

<script>
// ============================================================
//  DATA — 完整的管线数据
// ============================================================
const DATA = {
  label: '📦 内容运营管线',
  type: 'root',
  details: {
    desc: '内容生产 → 多平台发布 → 视频生成 → 数据追踪 → 商业变现 全链路',
    brand: '美好需要创造',
    positioning: 'AI提效实战派 + 融合框架',
    dirs: ['~/world-corner-blog/ 生产管线', '~/catalog/ 深度创作', '~/projects/remotion-video-platform/ 视频平台'],
    skills: '5个核心技能（~/.claude/skills/）'
  },
  children: [
    // ===== 1. 核心管线 =====
    {
      label: '⚡ 核心发文管线',
      type: 'group',
      details: { desc: '三条内容生产主路径：快速发文 → 深度创作 → 多平台分发' },
      children: [
        {
          label: '① 快速发文 — wechat-publish',
          type: 'skill',
          details: {
            title: 'wechat-publish · 公众号一键发文',
            desc: '5步直达公众号草稿：AI选题 → DeepSeek搜索 → JSON起草 → 公众号推送 → 内容登记',

              '• <b>Step 1 DeepSeek搜索</b>：Playwright控chat.deepseek.com，反检测三层+持久化storage_state<br>' +
              '• <b>Step 2 JSON起草</b>：LLM产出结构化JSON {title, digest, body}，V2加入了robust JSON解析（去markdown代码块+最外层{}提取+\\\\n转义回退）<br>' +
              '• <b>Step 3 公众号推送</b>：调WechatPlatform.publish()，走微信API创建草稿<br>' +

            architecture: '用户输入\n  │\n  ▼\n[0/5] AI选题 ────── deepseek_web.search() ──── 正则提取\n  │\n  ▼\n[1/5] DeepSeek搜索 ── deepseek_web.search() ── Playwright\n  │\n  ▼\n[2/5] JSON起草 ────── deepseek_web.search() ── JSON解析(V2 robust)\n  │\n  ▼\n[3/5] 公众号推送 ──── WechatPlatform.publish() ── API草稿\n  │\n  ▼\n[4/5] 内容登记 ────── RegistryManager ── content_registry.json\n  │\n  ▼\nToken计费 ────────── deepseek_v3_tokenizer ── token-usage.jsonl',

              'DeepSeek Web依赖Playwright+持久化登录态，storage_state过期需要手动刷新',
              'JSON起草prompt死板，产出质量依赖LLM能力上限，无质量审核闸门',
              '无重试机制——任何一个步骤失败（搜索/JSON解析/推送）都直接return，没有自动重试',
              'Token计费用的是本地v3 tokenizer而非API返回，计数有偏差',
            ],
            upstream: '无（独立入口）<br>调用自 content-orchestrator 的 Step 5',
            downstream: '• WechatPlatform → 微信API（草稿推送）<br>• RegistryManager → content_registry.json<br>• token-usage.jsonl（计费日志）',
            optimizations: [
              {

//  RENDER
// ============================================================
let activeNode = null;

function renderTree(data, parentEl, depth) {
  if (!data.children || !data.children.length) return;
  const ul = document.createElement('ul');
  ul.className = 'tree';

  data.children.forEach((child, idx) => {
    const li = document.createElement('li');

    // ── node bar ──
    const node = document.createElement('div');
    node.className = 'tree-node depth-' + depth;
    if (child._id) node.dataset.id = child._id;

    // toggle
    const hasChildren = child.children && child.children.length > 0;
    const tog = document.createElement('span');
    tog.className = 'toggle';
    tog.textContent = hasChildren ? '▼' : '·';
    if (!hasChildren) tog.style.visibility = 'hidden';
    node.appendChild(tog);

    // icon
    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = getIcon(child.type);
    node.appendChild(icon);

    // label
    const lbl = document.createElement('span');
    lbl.className = 'label';
    lbl.textContent = child.label;
    node.appendChild(lbl);

    // badge
    if (child.type === 'script') {
      const badge = document.createElement('span');
      badge.className = 'badge py';
      badge.textContent = '.py';
      node.appendChild(badge);
    } else if (child.type === 'platform') {
      const badge = document.createElement('span');
      badge.className = 'badge platform';
      badge.textContent = '平台';
      node.appendChild(badge);
    } else if (child.type === 'skill') {
      const badge = document.createElement('span');
      badge.className = 'badge key';
      badge.textContent = 'skill';
      node.appendChild(badge);
    }

    // click
    node.addEventListener('click', (e) => {
      e.stopPropagation();
      if (hasChildren) {
        const wrapper = li.querySelector(':scope > .children');
        const isNowCollapsed = wrapper.classList.toggle('collapsed');
        tog.classList.toggle('closed', isNowCollapsed);
      }
      showDetail(child);
      document.querySelectorAll('.tree-node.active').forEach(el => el.classList.remove('active'));
      node.classList.add('active');
    });

    li.appendChild(node);

    // children
    if (hasChildren) {
      const wrapper = document.createElement('div');
      wrapper.className = 'children';
      li.appendChild(wrapper);
      renderTree(child, wrapper, depth + 1);
      // auto-expand first 2 levels; collapse deeper levels initially
      if (depth >= 1) {
        wrapper.classList.add('collapsed');
        tog.classList.add('closed');
      }
    }

    ul.appendChild(li);
  });

  parentEl.appendChild(ul);
}

function getIcon(type) {
  switch(type) {
    case 'root': return '🏠';
    case 'group': return '📂';
    case 'skill': return '🧠';
    case 'script': return '📄';
    case 'platform': return '🌐';
    case 'timeline': return '📅';
    case 'data': return '📁';
    case 'builtin': return '⚙️';
    case 'project': return '📦';
    case 'doc': return '📝';
    default: return '📄';
  }
}

function showDetail(data) {
  const d = data.details || {};
  const el = document.getElementById('detailContent');
  const empty = document.getElementById('emptyDetail');
  empty.style.display = 'none';
  el.style.display = 'block';

  let html = '';

  // title
  if (d.title) {
    html += `<h2>${d.title}</h2>`;
  } else {
    html += `<h2>${data.label}</h2>`;
  }

  // subtitle / desc
  if (d.desc) html += `<p class="subtitle">${d.desc}</p>`;

  // ─── 核心架构 ───
  if (d.overview) {
    html += `<div class="detail-section"><h3>核心架构</h3><p>${d.overview}</p></div>`;
  }
  if (d.architecture) {
    html += `<div class="detail-section"><h3>架构流程</h3><div class="code-block">${escapeHtml(d.architecture)}</div></div>`;
  }

  // ─── 优点 / 缺点 ───
  if (d.pros && d.pros.length) {
    html += `<div class="detail-section"><h3>✅ 优点</h3><ul>`;
    d.pros.forEach(p => html += `<li>${escapeHtml(p)}</li>`);
    html += `</ul></div>`;
  }
  if (d.cons && d.cons.length) {
    html += `<div class="detail-section"><h3>⚠️ 缺点 / 风险</h3><ul>`;
    d.cons.forEach(c => html += `<li>${escapeHtml(c)}</li>`);
    html += `</ul></div>`;
  }

  // ─── 上下游关系 ───
  if (d.upstream || d.downstream) {
    html += `<div class="detail-section"><h3>上下游关系</h3><table class="detail-table"><tbody>`;
    if (d.upstream) html += `<tr><td style="width:80px;color:var(--gold);font-weight:600;">⬆ 上游</td><td>${d.upstream}</td></tr>`;
    if (d.downstream) html += `<tr><td style="width:80px;color:var(--gold);font-weight:600;">⬇ 下游</td><td>${d.downstream}</td></tr>`;
    html += `</tbody></table></div>`;
  }

  // ─── 可优化空间 + 理论依据 ───
  if (d.optimizations && d.optimizations.length) {
    html += `<div class="detail-section"><h3>🔧 可优化空间</h3>`;
    d.optimizations.forEach((opt, i) => {
      const priorityMap = {高: '🔴', 中: '🟡', 低: '🟢'};
      const pIcon = priorityMap[opt.priority] || '⚪';
      html += `<div style="background:var(--bg3);border-radius:6px;padding:10px 14px;margin-bottom:10px;border-left:3px solid ${opt.priority === '高' ? 'var(--red)' : opt.priority === '中' ? 'var(--gold)' : 'var(--green)'};">`;
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">`;
      html += `<span>${pIcon}</span><strong>${escapeHtml(opt.suggestion)}</strong>`;
      html += `<span style="font-size:11px;background:var(--bg2);padding:1px 8px;border-radius:8px;color:var(--text-dim);">${opt.priority}优先级</span>`;
      html += `</div>`;
      if (opt.detail) html += `<p style="font-size:12.5px;margin:4px 0;opacity:.85;">${opt.detail}</p>`;
      if (opt.reference) html += `<p style="font-size:11px;color:var(--gold-dim);margin:2px 0 0;"><em>📚 理论依据：${opt.reference}</em></p>`;
      html += `</div>`;
    });
    html += `</div>`;
  }

  // ─── 命令 ───
  if (d.cmd) {
    html += `<div class="detail-section"><h3>一键运行</h3>`;
    html += `<div class="code-block">${escapeHtml(d.cmd)}</div>`;
    if (d.cmd2) html += `<div class="code-block" style="margin-top:4px;">${escapeHtml(d.cmd2)}</div>`;
    html += `</div>`;
  }

  // trigger
  if (d.trigger) {
    html += `<div class="detail-section"><h3>触发关键词</h3><p>${d.trigger}</p></div>`;
  }

  // constraints
  if (d.constraints) {
    html += `<div class="detail-section"><h3>品牌约束</h3><p>${d.constraints}</p></div>`;
  }

  // specs / scenes
  if (d.specs) {
    html += `<div class="detail-section"><h3>规格</h3><p>${d.specs}</p></div>`;
  }
  if (d.scenes) {
    html += `<div class="detail-section"><h3>场景结构</h3><p>${d.scenes}</p></div>`;
  }
  if (d.notes) {
    html += `<div class="detail-section"><h3>核心特性</h3><p>${d.notes}</p></div>`;
  }

  // files
  if (d.files && d.files.length) {
    html += `<div class="detail-section"><h3>文件清单</h3><table class="detail-table"><thead><tr><th>文件</th><th>说明</th><th>版本</th></tr></thead><tbody>`;
    d.files.forEach(f => {
      html += `<tr><td><span class="detail-tag ${f.tag ? f.tag.split(' ')[0] : 'py'}">${escapeHtml(f.name)}</span></td><td>${escapeHtml(f.desc || '')}</td><td>${escapeHtml(f.ver || '')}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }

  // iterations
  if (d.iterations && d.iterations.length) {
    html += `<div class="detail-section"><h3>迭代记录</h3><div class="iter-timeline">`;
    d.iterations.forEach(it => {
      const m = it.match(/^(\d{4}-\d{2}-\d{2})\s+(.*)/);
      if (m) {
        html += `<div class="iter-item"><span class="iter-date">${m[1]}</span><span class="iter-desc">${m[2]}</span></div>`;
      } else {
        html += `<div class="iter-item"><span class="iter-desc">${it}</span></div>`;
      }
    });
    html += `</div></div>`;
  }

  // timeline (special)
  if (d.timeline && d.timeline.length) {
    html += `<div class="detail-section"><h3>迭代时间线</h3><div class="iter-timeline">`;
    d.timeline.forEach(([date, desc]) => {
      html += `<div class="iter-item"><span class="iter-date">${date}</span><span class="iter-desc">${desc}</span></div>`;
    });
    html += `</div></div>`;
  }

  el.innerHTML = html;
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================
//  SEARCH
// ============================================================
function filterTree(query) {
  const nodes = document.querySelectorAll('.tree-node');
  const q = query.toLowerCase().trim();

  nodes.forEach(node => {
    const text = node.textContent.toLowerCase();
    const li = node.closest('li');
    if (!q) {
      li.style.display = '';
      node.innerHTML = node.innerHTML.replace(/<mark class="hl">/g, '').replace(/<\/mark>/g, '');
      return;
    }
    const match = text.includes(q);
    li.style.display = match ? '' : 'none';

    // highlight
    if (match && q.length > 0) {
      const label = node.querySelector('.label');
      if (label) {
        const orig = label.textContent;
        const idx = orig.toLowerCase().indexOf(q);
        if (idx >= 0) {
          label.innerHTML = orig.slice(0, idx) + '<mark class="hl">' + orig.slice(idx, idx + q.length) + '</mark>' + orig.slice(idx + q.length);
        }
      }
    }
  });

  // auto-expand visible parents
  document.querySelectorAll('.children').forEach(c => {
    const hasVisible = c.querySelector('li[style*="display: block"], li[style*="display: list-item"], li:not([style*="display: none"])');
    if (hasVisible && q) {
      c.classList.remove('collapsed');
      const toggle = c.parentElement?.querySelector('.toggle');
      if (toggle) toggle.classList.remove('closed');
    }
  });
}

// ============================================================
//  INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  const treePanel = document.getElementById('treePanel');
  renderTree(DATA, treePanel, 0);
  // expand root
  const first = treePanel.querySelector('.children');
  if (first) { first.classList.remove('collapsed'); }
});
</script>
