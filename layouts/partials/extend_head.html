{{- if in site.BaseURL "github.io" }}
<meta http-equiv="refresh" content="0; url={{ .Permalink | replaceRE `zhao818\.github\.io/world-corner-blog` `blog.worldcorner.xyz` }}">
<link rel="canonical" href="{{ .Permalink | replaceRE `zhao818\.github\.io/world-corner-blog` `blog.worldcorner.xyz` }}">
{{- end }}
{{- /* 字体已自托管于 static/fonts(见 assets/css/extended/webfonts.css),不再外链 Google Fonts */ -}}
<meta name="baidu-site-verification" content="codeva-NYTSXhST0l" />
{{- /* 社交分享卡:微信/微博/TG 等抓取使用的统一品牌封面 */ -}}
<meta property="og:image" content="{{ site.BaseURL }}images/og-cover.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
{{- /* WebSite 结构化数据:钉死中文站点名,供 Google/百度搜索标题与站点名展示 */ -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "世界一隅",
  "alternateName": "认知能量工程",
  "url": "{{ site.BaseURL }}",
  "logo": {
    "@type": "ImageObject",
    "url": "{{ site.BaseURL }}images/mark.svg"
  },
  "publisher": {
    "@type": "Organization",
    "name": "世界一隅",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.BaseURL }}images/mark.svg"
    }
  }
}
</script>
