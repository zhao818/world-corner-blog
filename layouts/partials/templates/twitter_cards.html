{{- /* 全站统一大图分享卡:复用全局 og-cover.jpg。
   覆盖 PaperMod 默认(无 cover.image / images 参数时回退为 summary 小卡),
   保证 twitter:card 只有一条且为 summary_large_image,与 extend_head.html 的 og:image 配套。
   同时消除 extend_head 手动卡片与主题卡片并存导致的重复。 */ -}}
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="{{ "images/og-cover.jpg" | absURL }}" />
<meta name="twitter:title" content="{{ .Title }}"/>
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{if .IsPage}}{{ .Summary }}{{ else }}{{ with site.Params.description }}{{ . }}{{ end }}{{ end }}{{ end -}}"/>
