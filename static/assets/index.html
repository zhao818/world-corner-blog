  .meta b { color:var(--fg); }

  .actbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 14px;
            border:1px solid var(--line); border-radius:10px; background:var(--panel); margin-bottom:20px; }
  .actbar .hint { font-size:13px; color:var(--fg); }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px;
          font-size:13px; color:var(--fg); border:1px solid var(--line); background:#0e1424;
          cursor:pointer; text-decoration:none; transition:all .15s; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn-gold { background:var(--accent); color:#0f1420; border-color:var(--accent); font-weight:600; }

  .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
  #q { flex:1; min-width:220px; padding:9px 12px; border-radius:8px; border:1px solid var(--line);

  #q:focus { border-color:var(--accent); }
  #c, #t { padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:#0e1424;
        color:var(--fg); font-size:13px; outline:none; }
  .count { font-size:12px; color:var(--dim); margin-bottom:12px; }
  .cards { display:grid; grid-template-columns:1fr; gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px;
          cursor:pointer; transition:border-color .15s, transform .1s, box-shadow .15s; }
  .card:hover { border-color:var(--accent); transform:translateY(-1px); box-shadow:0 6px 18px rgba(0,0,0,.28); }
  .card .nm { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .card .ic { font-size:15px; }
  .card .nm code { font-family:Consolas,monospace; font-size:13px; color:var(--accent); }
  .card .type { font-size:10px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .card .tag { font-size:10px; color:var(--dim); border:1px solid var(--line); border-radius:999px;
                padding:2px 8px; }
  .card .flag { font-size:10px; padding:2px 8px; border-radius:999px; margin-left:auto; flex:none; }
  .card .flag.get { color:#0f1420; background:var(--accent); font-weight:600; }
  .card .flag.cus { color:var(--dim); border:1px solid var(--line); }
  .card .ds { font-size:12px; color:var(--dim); line-height:1.7; margin-top:6px; }
  .card .hint { font-size:11px; color:var(--dim); margin-top:8px; }
  .card.hide { display:none; }

  /* 弹窗 */
  .mask { position:fixed; inset:0; background:rgba(5,8,14,.72); z-index:50; display:flex;
          align-items:center; justify-content:center; padding:20px; }
  .mask[hidden] { display:none; }
  .modal { width:100%; max-width:520px; background:var(--panel); border:1px solid var(--line);
           border-radius:14px; padding:20px; position:relative; max-height:82vh; overflow:auto; }
  .m-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding-right:32px; }
  .m-head code { font-family:Consolas,monospace; font-size:17px; color:var(--accent); }
  .m-head .type { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .m-head .flag { font-size:10px; padding:2px 8px; border-radius:999px; }
  .m-head .flag.get { background:var(--accent); color:#0f1420; font-weight:600; }
  .m-head .flag.cus { border:1px solid var(--line); color:var(--dim); }
  .m-close { position:absolute; top:14px; right:14px; width:28px; height:28px; border-radius:50%;
             border:1px solid var(--line); background:transparent; color:var(--dim); font-size:16px;
             line-height:1; cursor:pointer; }
  .m-close:hover { color:var(--fg); border-color:var(--accent); }
  .m-ds { font-size:14px; line-height:1.8; color:var(--fg); margin:14px 0 8px; }
  .m-tags { display:flex; flex-wrap:wrap; gap:8px; list-style:none; margin-bottom:16px; }
  .m-tags li { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:2px 8px; }
  .m-note { font-size:12px; color:var(--dim); line-height:1.7; margin-bottom:16px; padding:10px 12px;
            border-left:2px solid var(--line); background:rgba(0,0,0,.18); border-radius:0 8px 8px 0; }

  .toast { position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:60;

</style>

      return '<span class="tag">' + x + '</span>'; }).join('') : '';
    var share = isShare(it.n);
    var flag = share
      ? '<span class="flag get">可获取</span>'
      : '<span class="flag cus">按需定制</span>';
    var hint = share ? '点我获取这份技能包' : '点我查看 · 联系作者按需定制';
    html += '<div class="card" onclick="openAt(' + idx + ')">' +
      '<div class="nm">' +
      (it.i ? '<span class="ic">' + it.i + '</span>' : '') +
      '<code>' + it.n + '</code>' +
      '<span class="type" style="color:' + (TP[it.t] || '') + ';border-color:' + (TP[it.t] || '') + '40;">' + (TC[it.t] || it.t) + '</span>' +
      tags + flag + '</div>' +
      (it.d ? '<p class="ds">' + it.d + '</p>' : '') +
      '<p class="hint">' + hint + '</p>' +
      '</div>';
  });
  cardsEl.innerHTML = html;
  countEl.textContent = '共 ' + shown + ' 项';
}

function openAt(idx) {
  current = DATA[idx];
  var share = isShare(current.n);
  document.getElementById('m-n').textContent = current.n;
  var tb = document.getElementById('m-type');
  tb.textContent = TC[current.t] || current.t;
  tb.style.color = TP[current.t] || '';
  tb.style.borderColor = (TP[current.t] || '') + '40';
  var fl = document.getElementById('m-flag');
  fl.className = 'flag ' + (share ? 'get' : 'cus');
  fl.textContent = share ? '可获取' : '按需定制';
  document.getElementById('m-d').textContent = current.d || '';
  document.getElementById('m-tags').innerHTML = current.g
    ? current.g.split(',').filter(Boolean).map(function (x) { return '<li>' + x + '</li>'; }).join('')
    : '';
  document.getElementById('m-note').textContent = share
    ? '这份是能打包分享的技能/工具。点击下方「获取这份技能包」,会生成一封申请邮件发到我邮箱,我再把包发给你;也可以直接写邮件说明需求。'
    : '这一项是自用配置(含本机路径/密钥),不适合直接打包外发。需要的话写邮件联系我,说明你的场景,我按需提供或帮你定制。';
  document.getElementById('m-get').hidden = !share;
  maskEl.hidden = false;
  document.body.style.overflow = 'hidden';
}

function closeModal() { maskEl.hidden = true; current = null; document.body.style.overflow = ''; }

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2200);
}

function copyText(t, ok) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function(){ showToast(ok); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast(ok); } catch(e){}
    document.body.removeChild(ta);
  }
}

function copyEmail() { copyText(EMAIL, '已复制邮箱: ' + EMAIL); }

function requestGet() {
  if (!current) return;
  var msg = '你好,我想获取《' + current.n + '》,请发我一份技能包/源码。\n我的联系方式:' +
    '\n  邮箱: ____\n  (可以的话留个说明,好按你的场景给最合适的版本。)';
  copyText(msg, '已复制申请消息,发邮件给我即可');
  setTimeout(function(){ window.location.href = 'mailto:' + EMAIL + '?subject=' +
    encodeURIComponent('获取《' + current.n + '》') + '&body=' + encodeURIComponent(msg); }, 300);
}

maskEl.addEventListener('click', function (e) { if (e.target === maskEl) closeModal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
qEl.addEventListener('input', render);
cEl.addEventListener('change', render);
tEl.addEventListener('change', render);
render();
</script>
</body>
</html>
