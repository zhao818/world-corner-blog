const DATA = {"generated_at": "2026-08-23 19:04", "files": [{"path": "docs/AI资讯/AI免费午餐真相.html", "title": "AI免费午餐真相", "text": " \n\n ✦ 实战 · AI 省钱 \n\n 开源了、不限量、永久免费——2026 年,每个 AI 厂商都在喊免费。我把手头能实测的通道全跑了一遍,顺便把自己跑进了 429。这篇文章不转新闻标题,只讲我亲测的真实数据和那行 50 万 token 的报错原文。 \n\n \n 壹 · 我亲测的四条通道 \n •  DeepSeek : deepseek-v4-flash  / pro 实测对话成功,OpenAI 兼容,成本极低。注意:是低价,不是免费 \n •  阿里云百炼 :一个 key 挂几十个模型, qwen3.7-flash  实测成功,实名认证后有每日免费额度 \n •  NVIDIA NIM :免费约 40 RPM, llama-8b  实测成功,key 现成 \n •  Gemini Flash 系 :永久免费档,15 RPM / 每天 1500 次 / 每月约 100 万 token。最大的坑:一旦绑卡开 billing,免费层立即消失 \n\n ✦ 金句:四条通道都能用,但没有一条叫「无限」。 \n \n\n \n 贰 · Grok Build 的「免费」真相 \n 最近 Grok Build 宣布开源,很多人以为「免费不限量」了。实测结论:客户端确实开源( xai-org/grok-build ),但模型额度并没有取消。 \n • 免费层 =  grok-4.5  50 万 token / 滚动 24 小时窗口 \n • 我的真实报错原文: 429 Too Many Requests: subscription:free-usage-exhausted ... tokens (actual/limit): 516081/500000  \n • 超额即停,等 24 小时滚动窗口重置;想更高额度 → SuperGrok 订阅 \n • 附带情报:xAI API 新号送 $25、未付费每 30 天 $5、开「数据共享」可拿 $150/月——但数据共享是永久不可逆的 \n\n ✦ 金句:516081 / 500000——超额 16081 个 token,系统就敢把你的请求拒之门外,还贴心地告诉你等 24 小时。 \n \n\n \n 叁 · 免费机制的三种类型 \n\n  ① 限速换免费(永久)  代表:Gemini Flash 系 代价:15 RPM,日 1500 次,月 100 万 token。稳定但慢,适合轻量调用。 \n\n  ② 信用额度(用完即止)  代表:xAI API 新号 $25 / 每月 $5 代价:扣完就没了;开「数据共享」可换 $150/月,永久不可逆。 \n\n  ③ 数据换量 + token 上限  代表:Grok Build 免费层 代价:数据可能用于训练,50 万 token / 24h,超额 429 硬停。 \n\n ✦ 金句:厂商说的「免费」,要么限你的速度,要么限你的额度,要么换你的数据——看懂条款,才叫真白嫖。 \n \n\n \n 避坑清单 \n •  429 不等于坏了 :报错里出现  free-usage-exhausted  就是额度用完,等窗口重置即可,别瞎换 key \n •  Gemini 开 billing 前想清楚 :免费层回不去,小额绑卡也可能触发付费 \n •  免费档隐私 :代码和数据可能被用于训练,敏感项目别用免费层 \n ✦ 金句:会白嫖的人,把免费当试错;不会白嫖的人,把免费当信仰。 \n 关注公众号「美好需要创造」,闲鱼搜「AI编程踩坑清单」。 \n \n\n \n", "mtime": 1786875671, "size": 7203}, {"path": "docs/AI资讯/AI半月动态速览.html", "title": "AI半月动态速览", "text": " \n\n ✦ 实战 · AI 动态 \n\n 过去半个月,AI 圈的更新密度比三伏天的气温还高:Google 把 Flash 系推理模型价格直接砍半,阿里把 Qwen 3.8 家族从本地到超大杯一次铺满,英伟达放出了一个为 Agent 而生的本地模型,还有人整理了一份「免费大模型 API 白嫖榜单」。这篇文章把值得普通人关注的五件事一次讲清,最后附一个开源工具彩蛋。 \n\n \n 壹 · Gemini 3.7 Flash —— 推理升级,价格减半 \n Google 发布了  gemini-3.7-flash ,这一代的重点不是「更会聊天」,而是「更会干活」:推理能力针对软件工程、Web 开发和有 Agent 参与的长流程任务做了专门优化。 \n\n 三个值得知道的点 \n • 真实软件工程与 Agent 基准明显提升,解决 issue 的能力更强,agent 空转死循环更少 \n • 从设计稿直接生成高保真网页代码,还原度更高,还能反过来核对已有代码是否 1:1 还原设计稿 \n •  发布期半价 :每百万输入 token 只要  $0.75 ,输出  $3.75 ,优惠到 2026 年 12 月 31 日,约为原 3.6 Flash 的一半 \n\n ✦ 金句:Flash 系半价,等于把「让 Agent 多跑几轮」的试错成本也打了五折。 \n \n\n \n 贰 · Qwen 3.8 家族 —— 本地最强到 2.4T 超大杯 \n 阿里 Qwen 3.8 系列两周内密集上新,从「自己电脑能跑的」到「云端超大杯」一次铺满。 \n\n Qwen 3.8 27B:本地开源新标杆 \n • 同类参数里最强,专为 Agent 设计:能稳定执行多步复杂任务,支持图像输入(多模态) \n •  262K 原生上下文 ,适合长会话编程;Apache 2.0 协议,随便商用 \n • 一条命令开跑: ollama run qwen3.8  \n • 性能彩蛋:和苹果 MLX 合作优化,M5 Max 芯片上能跑出 70+ token/秒 \n\n Qwen3.8-Max:2.4T 参数的云端大杯 \n • 已在 Qoder 全线产品上线,注册即送免费额度,想尝鲜的直接去试 \n\n ✦ 金句:本地能跑、协议开源、还能商用——Qwen 3.8 27B 是「不花钱用上强模型」的最短路径。 \n \n\n \n 叁 · 免费 LLM API 榜单 —— 白嫖党的收藏夹 \n xAI 的 Grok 整理了一份「免费 / 低门槛大模型 API 平台排名」(数据截至 2026 年 8 月中旬),筛选标准对开发者非常实用: \n • 原生或高度兼容 OpenAI Chat Completions 格式——只改  base_url  和  api_key  就能接上 \n • 有真实可用的免费额度或永久免费模型,不是「免费试用五分钟」 \n • 国内直连友好、支持支付宝 / 微信支付等主流方式,方便后续升级付费 \n\n ✦ 金句:免费额度不是羊毛,是「先跑通、再付费」的入场券;接 API 前先看速率限制和隐私条款。 \n \n\n \n 肆 · NVIDIA Nemotron 3.5 Lightning —— 为 Agent 而生的本地模型 \n 英伟达的开源模型  nemotron-3.5-lightning  上线 Ollama,主打「完全在自己设备上跑」:30B 总参数、每 token 只激活 3B 的混合 MoE 架构,RTX 电脑就能带得动。 \n\n 为什么值得关注 \n • 专为常驻 Agent 打造:读文件、调工具、整理结果、失败重试——这些高频小步骤根本不需要大模型 \n •  1M token 上下文 ,本地跑意味着数据完全不出设备,适合个人助理、编码子 Agent、安全分析 \n • 推测解码最高 4 倍吞吐,一条命令开跑: ollama run nemotron-3.5-lightning  \n • 同期 Ollama 还支持了 DeepSeek Harness:一条命令把本地模型和云端模型配置进同一个 Agent 编排 \n\n ✦ 金句:高频小事交给本地小模型,大事再上云——省钱的本质是「把流量分层」。 \n \n\n \n 伍 · 避坑提醒 —— Groq 老模型正在退役 \n 用 GroqCloud 的开发者注意: Llama 3.3 70B Versatile  已于 8 月 16 日正式下线, Llama 3.1 8B Instant  也在退役名单里。 \n • 下线后请求不再服务,线上还在调用的接口会直接报错 \n • Groq 官方建议迁移到  GPT OSS 120B  或  Qwen3.6 27B  \n\n ✦ 金句:云上的模型会「过期」,别把某个模型名写死在代码里——留一层抽象,随时可换。 \n \n\n \n 六 · 一句话总结 + 彩蛋 \n 要省钱:Gemini 3.7 Flash 半价到年底;要免费:Qwen 3.8 27B 本地开源随便跑;要省心:Nemotron 3.5 Lightning 把高频 Agent 步骤留在本机;要避坑:及时换掉 Groq 上即将退役的模型。 \n • 彩蛋一: GenOffice  —— 开源 AI 原生桌面办公套件,原生读写 docx / xlsx / pptx / pdf,内嵌 AI Agent 编辑(8 月 15 日发布稳定版) \n • 彩蛋二: Agenta  —— 开源 Agent 工作区,支持定时触发、MCP 工具、本地自托管,适合流程自动化 \n ✦ 金句:模型更新比钱包更新快,省钱和省心的关键,永远是选对场景。 \n 关注公众号「美好需要创造」,闲鱼搜「AI编程踩坑清单」。 \n \n\n \n", "mtime": 1786869527, "size": 11140}, {"path": "docs/backend-architecture-review-2026-08-21.md", "title": "backend-architecture-review-2026-08-21", "text": "  灵魂之觅 小程序后端架构审核报告\n\n  审核日期：2026 08 21 · 审核范围：7 个云函数（约 2100 行）、utils/cloudData.js 调用层、app.js 启动链路、cloudbaserc.json 部署配置、13 个数据库集合的访问模式\n\n \n\n  一、总体评价\n\n 架构骨架是健康的，但安全层有 4 个必须立即处理的漏洞，性能层有 1 个规模化炸弹。 \n\n  维度   评分   评语  \n \n  领域拆分   ★★★★☆   按用户/答案/配对/聊天/AI/反馈拆成 7 个函数，边界清晰  \n  降级容错   ★★★★☆   AI 三级降级链（混元→DeepSeek→本地算法）+ 缓存设计，意识很好  \n  安全性   ★★☆☆☆   密钥泄露 + 2 个后门 + 2 处越权写，是最大短板  \n  性能与扩展   ★★☆☆☆   匹配算法 N+1 全表扫描，用户破 500 后成本和延迟会陡增  \n  一致性/可维护   ★★★☆☆   前后端契约有 2 处断裂（假同步），公共逻辑重复 4 份  \n\n做得好的地方先说清楚：\n\n1.  统一调用封装层 （utils/cloudData.js）——所有页面不直接调 wx.cloud.callFunction，这个分层纪律很好，改后端时前端零侵入。\n2.  AI 降级链 ——混元免费额度优先、DeepSeek 备用、确定性算法兜底，且 pairing service 对 AI 调用做了 8s/25s 超时竞赛 + 静默回退，不会因 AI 挂掉阻塞匹配。\n3.  缓存设计 ——兼容报告缓存 24h 按答案内容哈希失效、匹配精算缓存 30min 按答题数失效，失效条件设计正确。\n4.  输入校验意识 ——答案长度上限、有意义字符校验、周期内 5 次上限、撤回 2 分钟窗口、大头像保险丝，细节考虑得多。\n5.  诚实的产品设计 ——AI 幻觉防线（openid 对齐回退 + 短答案真实引用覆盖）是实战踩坑后补的，有效。\n\n \n\n  二、P0 —— 安全漏洞（立即处理）\n\n  1. 管理员 API Key 明文写在 cloudbaserc.json（最高危）\n\n cloudbaserc.json  第 10 行的  TCB ADMIN APIKEY  是一个  长期有效（2030 年到期）、is system admin true 的超级管理员凭证 ，明文存在代码仓库里。任何拿到这份代码的人等于拿到整个环境的 root：读改所有用户数据、删库、调用所有云函数。\n\n你已经在 hunyuanAIV2 代码里删掉了它（代码注释还留着提醒）， 但 cloudbaserc.json 这份还在 。\n\n 处置 ：\n1. 去云开发控制台 → 密钥管理， 作废/轮换 这个 API Key（轮换后 tcb CLI 登录用新 Key）。\n2. cloudbaserc.json 改用  {{env.TCB ADMIN APIKEY}}  环境变量引用（你已经给 DEEPSEEK API KEY 用了这个写法，照抄即可）。\n3. 如果这份代码推送过 Git 远程仓库，轮换是唯一补救，删文件没用（历史提交里还在）。\n\n  2. answer sync 的  testOpenid  后门\n\n \n\n配合泄露的 API Key（或任何 HTTP 直调途径），攻击者可传任意  testOpenid   读、写、删除任何用户的答案 （deleteAll 是全删）。真实小程序调用时 OPENID 恒有值，所以删掉这个兜底不影响线上功能；测试需要走真实上下文。\n\n  3. pairing service 的  event.openid  兜底后门\n\n \n\n同理，可冒充任何用户创建/加入/解除配对。一并删除。\n\n  4. 两处水平越权写\n\n   user service  setAppVersion  无鉴权 ：任何普通用户都能改全局版本号（全员生效）。feedback service 已经有  DEV OPENIDS  白名单模式，setAppVersion 照抄即可（把白名单抽成公共常量更好）。\n   pairing service  unpair  无成员校验 ：不验证调用者是 userA/userB，知道 pairingId 就能拆散别人的配对。chat service 的  checkPairing()  就是现成的正确写法，补一个即可。\n\n \n\n  三、P1 —— 性能炸弹与契约断裂\n\n  5. matchCandidates 的 N+1 全表扫描（规模化最大风险）\n\n当前匹配一次    分页拉全部用户（上限 500）+ Promise.all 并发查每个用户的 answers（最多 500 个并发 DB 查询） 。\n\n  用户量 100 时：约 102 次 DB 读，勉强能用；\n  用户量 500 时：约 502 次 DB 读，单次匹配延迟数秒、读配额消耗暴增（云开发按读次数计费）；\n  用户量 1000+ 时：直接超时不可用，且 500 上限意味着第 501 个用户永远匹配不到。\n\n 改造方案（按性价比排序） ：\n1.  短期 ：把「逐个查 answers」改成一次  db.collection('answers').limit(1000).get() （或分 2 页拉全量），在内存里按 openid 分组——从 N+1 次查询降到 1 2 次。\n2.  中期 ：用聚合  aggregate().group()  按题号建立倒排索引，或给 users 集合预存  answerDigest （关键词集合），匹配时只拉摘要。\n3.  长期 ：用户量大后把匹配改为离线预计算（定时触发器夜间跑全量两两打分存  match index ），线上只读结果。\n\n  6. 前后端契约断裂 ×2（假同步）\n\n   cloudData.uploadMedia()  调用 chat service 的  uploadMedia  action—— chat service 根本没实现这个 action （返回\"未知action\"）。好在聊天页实际走的是本地  uploadMediaFile  直传云存储，cloudData 这条是死代码，删掉即可。\n   cloudData.saveHypnosisPreset()  调用 user service 的  saveHypnosisPreset  action—— user service 同样没实现 ，而且  .catch()  把错误吞了，用户在催眠页保存预设时 以为同步成功了，实际云端什么都没存 。换机即丢数据。要么在 user service 补上这个 action（moodRecords 的模式可参考），要么前端明确提示\"仅本地保存\"。\n\n  7. 数据库安全规则待核查（前端直连 DB 的隐患）\n\n前端有两处绕过云函数直连数据库：\n   pages/chat/index.js  watch  messages  集合（实时消息）；\n   utils/globalAudioManager.js  直写  audio error logs  /  audio playback logs 。\n\n云函数里做了配对成员校验，但 客户端直连只受数据库安全规则约束 。如果 messages 集合的安全规则是默认的宽松模式，恶意用户可以用任意 pairingId 直接读到别人的私聊内容。请到云开发控制台 → 数据库 → 权限设置，确认：\n   messages ：自定义安全规则，读权限按  pairingId  限制（或至少改为\"仅创建者可读写\"+ 配对校验走云函数）；\n   audio logs ：仅创建者可写、禁止读；\n  其余所有集合： 全部设为\"仅创建者可读写\"或\"仅管理端可读写\" ——所有业务读写都应走云函数，客户端直连是例外而非通道。\n\n  8. AI 函数无调用限制\n\nhunyuanAIV2 任何用户可任意频次调用， analyzeCompatibility  的  candidates  参数 没有数量上限 ——恶意传几百个候选人可一次撑爆 token、烧光免费额度。建议：\n   candidates.slice(0, 3) ；\n  加简单频控（同一 openid 每分钟/每天调用上限，存 match ai cache 同款集合即可）。\n\n \n\n  四、P2 —— 值得改进但不紧急\n\n      问题   建议  \n \n  9    isContentSafe  在 4 个函数里复制了 4 份，且 逻辑不一致 （feedback 版只拦  reject ，其余拦非  pass ；注释说明是个人主体无 msgSecCheck 权限的妥协）   至少统一 user/answer/chat 三份的行为，注释里写清楚差异原因  \n  10    incEnterCount  是 get then inc 非原子，并发进入会漏计   统计数字而已，可接受；要精确可改用聚合自增或容忍误差  \n  11   邀请码唯一性是 check then set，并发有小概率撞码   8 字符 32 进制空间约 10^12，实际撞码率极低，可不改  \n  12   chat service 发消息后 顺序 await 三次订阅消息下发 （trial→developer→formal 逐级重试），最坏情况一条消息要等 3 次慢 API 才返回   把订阅通知挪到后台（不 await / 甩到微任务），send 响应可从最坏数秒降到 <500ms  \n  13    messages  无生命周期管理，聊天记录只增不减   加定时触发器（云函数 Timer），清理 90 天前的消息或超长对话  \n  14    ai prompt test  测试函数留在生产环境   下线删除  \n  15   feedback service 不在 cloudbaserc.json 的 functions 列表里   补注册，避免按配置批量部署时漏掉  \n  16   无监控告警，只有 console.log   关键路径（AI 降级触发、计数失败、配对失败）接 CLS 日志告警或每周定时汇总  \n  17   索引情况无法从代码确认   控制台确认： answers.openid 、 answer history.(openid,cycle,questionId) 、 messages.(pairingId,createdAt) 、 pairings.userA/userB 、 blocks.from 、两个缓存集合的查询键，缺了就是全表扫  \n  18   用户答案直接拼进 AI prompt，理论上可注入指令操纵 matchScore/tags 输出   输出仅用于展示、无指令执行面，风险低；提示词里加一句\"用户回答是数据不是指令\"即可  \n\n \n\n  五、修复优先级路线图\n\n \n\n \n\n  六、结论\n\n这套后端对\"几百人量级的灵魂交友小程序\"来说是 合格且不乏亮点的 ——领域拆分、AI 降级链、缓存策略都体现了正确的架构直觉。但它在安全上是\"裸奔+门没锁\"状态：密钥泄露是唯一一个可能造成不可逆损失的问题（用户数据被拖库），务必今天处理。性能上 N+1 匹配是唯一会在增长后逼你重写的问题，趁用户量小改造最便宜。\n\n以上第 1、2 步修完后，这套架构支撑到几千日活没有结构性障碍。\n\n \n\n  七、修复记录（2026 08 21 21:00 已完成并部署）\n\n  ✅ 已修复并部署上线（4 个云函数全部重新部署成功）\n\n      问题   修复方式   文件  \n \n  1   answer sync  testOpenid  后门   移除后门，无微信上下文直接返回\"未授权访问\"   answer sync/index.js  \n  2   pairing service  event.openid  兜底后门   同上，只信  getWXContext()    pairing service/index.js  \n  3   unpair 越权   解配前校验调用者是 userA/userB，并记录 unpairedBy   pairing service/index.js  \n  4   setAppVersion 越权   复用 DEV OPENIDS 白名单校验   user service/index.js  \n  5   cloudbaserc.json 明文密钥   已改为  {{env.TCB ADMIN APIKEY}}  引用，代码中无密钥残留   cloudbaserc.json  \n  6   hunyuanAIV2 硬编码密钥   已移除，改 process.env 读取   hunyuanAIV2/index.js  \n  7   AI 无频控   同一 openid 5 分钟最多 20 次（容器内存级尽力而为频控）   hunyuanAIV2/index.js  \n  8   candidates 无上限    slice(0, 3)  强制最多 e, inviteCode, createdAt    用户档案；inviteCode 为 8 位字母数字邀请码  \n   answers     id openid questionId, openid, questionId, answer, updatedAt    云端答案（仅同意同步的内容）；doc id 天然防重复  \n   pairings     id auto, userA, userB, status(pending/active), userAInviteCode, userBInviteCode, createdAt, updatedAt    配对关系；userA 创建邀请码者，userB 加入者  \n   messages     id auto, pairingId, from, content, createdAt    聊天消息；只通过 chat service 读写（云函数管理员权限，前端不可直连，保证安全）  \n\n 云函数接口约定 （前端统一经  utils/cloudData.js  调用）：\n   user service ： init （获取/创建用户+邀请码）、 get \n   answer sync ： save （单题答案）、 getAll （我的全部）、 getShared （配对双方互看答案，需双方都已答）\n   pairing service ： create （生成邀请码）、 join （用码绑定）、 get （我的配对状态）\n   chat service ： send 、 getMessages （增量拉取，前端3秒轮询）\n\n \n\n  阶段 P0：安全与工程清理\n\n  Task 1: 修复 hunyuanAIV2 硬编码 API Key\n\n Files: \n  Modify:  cloudfunctions/hunyuanAIV2/index.js:9 \n\n  [ ]  Step 1 : 将第 9 行  const DEEPSEEK API KEY   process.env.DEEPSEEK API KEY   \"bVjtJ6zTm8gwbD4IjcycbH9e2PJqnCNjpA1lPqiH1mE \"  改为  const DEEPSEEK API KEY   process.env.DEEPSEEK API KEY   '' ，并在为空时返回友好错误（不再回退到硬编码 Key）。\n  [ ]  Step 2 : 语法验证  node  check cloudfunctions/hunyuanAIV2/index.js \n  [ ]  Step 3 : 检查其余云函数是否还有硬编码 Key： Grep \"sk api[ ]?key. ['\\\"] Bearer\" cloudfunctions/ /index.js ，有则同样处理。\n\n  Task 2: 移除行为追踪链路\n\n Files: \n  Modify:  pages/hypnosis/index.js 、 pages/hypnosis/player/index.js （移除 tracking integration 引用与调用）\n  Delete:  utils/data collection tracker.js 、 utils/tracking integration.js 、 utils/data collection config.js \n  Delete:  cloudfunctions/uploadTrackingData/ 、 cloudfunctions/user tracking/ 、 cloudfunctions/getAnalyticsData/ \n\n  [ ]  Step 1 : 读取两个 hypnosis 文件，删除  require('../../utils/tracking integration.js')  及相关  xxxTracking(...)  调用行。\n  [ ]  Step 2 : 删除上述 6 个文件/目录。\n  [ ]  Step 3 : 验证  Grep \"tracking uploadTrackingData getAnalyticsData user tracking\" pages/ utils/  无残留（允许 hypnosis 内无匹配）。\n\n  Task 3: 删除几何AI全链路\n\n Files: \n  Delete:  pages/geometry/ \n  Delete:  utils/geometryData.js 、 utils/geometry s 天开源了。    01 为什么官方没有中文？  先说结论：这款桌面版（Tauri + WebView2 架构） 从设计上就没有汉化入口 。  • 应用本体二进制里，搜不到任何「zh-CN」字符串  • 没有语言文件、没有语言设置项  • 界面文案全部 硬编码 在应用里  所以「等官方汉化」这条路基本是堵死的。唯一可行的路，是 WebView2 调试端口 +  运行时注入 ： 不改应用本体 ，在界面渲染时把英文实时替换成中文。    02 这 238 条规则是怎么来的？  汉化不是翻译一份文件那么简单。我先把应用里 每一个界面 的真实文案逐屏抓出来——主页、聊天、设置、自动化、命令面板（Ctrl+K）、各种弹窗……  然后一条条对照翻译，做成字典；动态文案（比如「9% used」→「9% 已使用」）做成正则规则；发现界面会 随机轮换示例卡片 ，又加了「标题在字典里就自动翻译」的兜底逻辑。  最终是 238 条翻译规则，覆盖 160+ 条界面文案，而且 不误翻内容 ：AI 回复、代码、技能名、你的用户名，统统不会动。    03 怎么用？三步搞定  • 打开 https://github.com/zhao818/copilot-desktop-zh ，Clone 或下载 ZIP  • 把「copilot-zh」文件夹放进 Copilot 安装目录，例如「H:\\copilot\\GitHub Copilot\\copilot-zh」  • 双击「启动 GitHub Copilot 中文版.cmd」，自动以调试模式打开并注入中文  注意：一定要用这个启动器打开才是中文；直接点官方图标还是英文。需要装 Node.js，启动器会自动检测。    04 使用前注意这几件事  • 汉化是运行时注入：关闭启动器窗口 = 停止汉化，重新打开即恢复  • 图标 / 图片里的英文没法翻（那是图片，不是文字）  • 极少数动态句子没收录会保留英文，往字典加一行即生效  • 应用升级不受影响，因为不动应用本体    写在最后  界面全英文这件事，官方短期不会解决，但你可以今晚就解决。  这个补丁不追新、不折腾：装好、打开、中文界面，就这么简单。  觉得有用的话，去仓库点个 Star，或者转发给同样被英文界面折磨的朋友。  想直接跑起来？回复「中文」领《Copilot 桌面版中文汉化安装说明 + 常见问题》，今晚就能用上中文界面。  \n\n \n", "mtime": 1787112667, "size": 6021}, {"path": "docs/公众号文章/Copilot汉化/公众号推广文章_Copilot桌面版中文汉化.md", "title": "公众号推广文章_Copilot桌面版中文汉化", "text": "  你是不是也遇到过这种尴尬：软件功能全在，就是界面全英文？\n\nCopilot 桌面版功能确实强，但设置、菜单、命令面板全是英文，翻遍设置也找不到中文选项，网上还搜不到现成的汉化。\n\n说实话，我自己也被这个折磨了挺久。官方没有中文、没有语言包、没有插件机制——市面上那些汉化工具（GitHub Desktop 汉化、Codex 汉化）跟它根本不是同一个软件，全都用不上。\n\n于是我自己动手，给 Copilot 桌面版做了个运行时中文汉化补丁， 今天开源了。 \n\n  01 为什么官方没有中文？\n\n先说结论：这款桌面版（Tauri + WebView2 架构） 从设计上就没有汉化入口 。\n\n  应用本体二进制里，搜不到任何「zh CN」字符串\n  没有语言文件、没有语言设置项\n  界面文案全部 硬编码 在应用里\n\n所以「等官方汉化」这条路基本是堵死的。唯一可行的路，是 WebView2 调试端口 +  运行时注入 ： 不改应用本体 ，在界面渲染时把英文实时替换成中文。\n\n  02 这 238 条规则是怎么来的？\n\n汉化不是翻译一份文件那么简单。我先把应用里 每一个界面 的真实文案逐屏抓出来——主页、聊天、设置、自动化、命令面板（Ctrl+K）、各种弹窗……\n\n然后一条条对照翻译，做成字典；动态文案（比如「9% used」→「9% 已使用」）做成正则规则；发现界面会 随机轮换示例卡片 ，又加了「标题在字典里就自动翻译」的兜底逻辑。\n\n最终是 238 条翻译规则，覆盖 160+ 条界面文案，而且 不误翻内容 ：AI 回复、代码、技能名、你的用户名，统统不会动。\n\n  03 怎么用？三步搞定\n\n  打开 https://github.com/zhao818/copilot desktop zh ，Clone 或下载 ZIP\n  把「copilot zh」文件夹放进 Copilot 安装目录 pilot桌面版中文汉化", "text": "GitHub Copilot 桌面版从设计上就没有中文，官方短期也不会加。我做了个运行时汉化补丁：238 条规则、不动应用本体、升级不失效，三步装好今晚就用中文。仓库：github.com/zhao818/copilot desktop zh\n", "mtime": 1787115095, "size": 310}, {"path": "docs/公众号文章/天兵助手/公众号推广文章_内心的修炼全指南.html", "title": "公众号推广文章_内心的修炼全指南", "text": " \n\n ✦ 小程序 \n\n 「内心的修炼」小程序全指南：九关修炼 × 80+ 项数字资产，一个微信小程序全搞定  读了很多道理，日子还是老样子？不是你不够努力，而是你读过的每一本书、听过的每一个故事，都还只是「听过」，没有被拆解、重铸成你自己的东西。今天介绍一个把「修心」和「工具箱」同时装进微信的小程序——「内心的修炼」。   一、它是什么  「内心的修炼」（又名「数字百宝箱」）是公众号「美好需要创造」出品的微信小程序。它把两件事装进了一个入口：  •  一套身心社财四层生存系统 ：用经典打磨身心的九关修炼路径  •  80+ 项自研数字资产 ：AI 工具、脚本、技能、Agent 配置教程的展示橱窗  小程序基于微信云开发构建，核心 AI 能力由腾讯混元提供，纯展示 + AI 辅助，不需要任何后端服务器，也完全免费。打开微信搜索小程序「内心的修炼」就能进入。    二、修炼：九关递进，顺序本身就是修行  第一个 Tab 是「修炼」，也是整个小程序的灵魂。它把人生拆成四层、九关：  •  心理软件 ：断舍离（叔本华《人生的智慧》）→ 立根本（奥勒留《沉思录》）→ 炼心术（王阳明《传习录》）→ 破执念（萨特《存在主义是一种人道主义》）  •  身体硬件 ：养身体（睡眠 / 运动 / 饮食）  •  社会网络 ：结善缘（信任 / 利他 / 连接）→ 明规则（福柯《规训与惩罚》）  •  经济地基 ：明经济（曼昆《经济学原理》）→ 立财基（《富爸爸穷爸爸》）  体系宣言说得很直接：先修心——心不稳的人，拥有越多，毁灭越快；再养身——身体是心性的硬件；后结缘——孤身一人，再强的内心也撑不起生活；终立基——饿着肚子的人，很难守住原则。顺序本身就是修炼，不可跳过。  心稳，身才稳；身稳，缘才广；缘广，基才牢。先学会不被世界定义，才有资格去拥有世界。  每个关卡页面包含：阶段使命、核心痛点、认知解毒剂、每日觉察练习清单，以及该关对应的经典书目和文章大纲。目前合集规划共 54 篇（九关文章 + 开篇引言 + 完结篇），正在持续更新。   修炼页怎么用  • 1. 进入任意关卡，先读「使命」和「痛点」，对照自己  • 2. 每天勾选「每日觉察练习」，每勾一项都有「思想觉察 +1」的即时反馈  • 3. 点「AI 陪练」，进入该关专属的 AI 修炼导师聊天——导师会带着本关全部文章的核心观点回答你，回复控制在 300 字内，先共情、再给可立即执行的行动  • 4. 第 7 天做「收官自检」，填完回答让 AI 生成点评，一针见血指出卡点 + 肯定进步 + 给出 3 天内的小行动  • 5. 每关对话自动保存在本地，随时续聊，也可以一键清空   三、灵魂之觅：8 问定位你的修炼卡点  第二个 Tab 是「灵魂之觅」，一个心性自测入口。不知道从哪一关开始？先答题。  它内置 8 道题，每题三个选项，分别对应不同关卡。答完后由规则引擎算出你「权重最高」的卡点关卡，给出诊断标题、描述和「处方」——比如「知行脱节 · 亟需炼心术」，处方是重读王阳明《传习录》，在烂摊子里一念即行。  诊断之后，还能一键让 AI 生成不超过 600 字的《心性深度解读报告》，包含三部分：你的真实心性画像（结合具体回答）、当前最需要攻克的关卡、接下来 7 天的 3 个具体行动。  更完整的玩法在深度版：小程序会自动跳转到独立小程序「灵魂之觅」，做 36 问测试，得到情感 DNA 五型报告（连接型 / 探索型 / 表达型 / 守护型 / 创造型），并把你在这里的画像数据一起带过去。  测出来的不是标签，是方向。它告诉你起点在哪，修行告诉你下一步往哪走。    四、百宝箱：80+ 项自研数字资产  第三个 Tab 是「百宝箱」，作者的自研成果展示目录，按 8 大分类整理：  •  AI 开发工具 ：DeepSeek 工具集、AI 记忆助手、Hermes / Reasonix / Claude Code 等 Agent 配置  •  脚本超市 ：46 个自研脚本，搜索类、发布类、代理类、监控与工具类  •  办公文档方案 ：VBA 文档工具集、docx 批量生成 / 填表、PDF 处理技能  •  内容创作工具 ：公众号发布技能、封面生成脚本、视频流水线  •  系统工具 / 桌面应用 / 知识资产 / Agent 配置教程   使用方式有三种：  •  左右双栏浏览 ：左侧切分类，右侧看资产列表  •  关键词搜索 ：顶部搜索框支持按名称、描述、标签、分类模糊匹配  •  AI 智能推荐 ：点「AI 智能推荐」，用一句话描述需求（比如「给视频批量加字幕翻译」），混元会从 80+ 项资产里挑出 1-5 项并附推荐理由  每个资产详情页都有简介、类型标签、包含内容清单，底部可一键复制公众号名称或查看关注指引。    五、免费领：作者不定期开放的免费工具  第四个 Tab 是「免费领」，目前开放了 8 个免费自研工具：Hermes 配置、Windows 优化脚本、DeepSeek 搜索、docx 批量生成技能、AI 封面生成、Reasonix Code、VBA 文档工具集、爬虫工具集。  工具会不定期更新，免费资源的获取方式、最新开放名单，以公众号「美好需要创造」动态为准。    六、我的：名片、打卡与电子书  第五个 Tab 是「我的」，个人中心，也是把修炼沉淀下来的地方：  •  修行与灵魂名片 ：修修昵称、真实微信号、累计打卡天数、最新诊断，一目了然  •  结善缘名片 ：独立页面，名片上的「修性类型」不是随便选的，而是算法根据你的真实阅读停留时长、答题记录和打卡日志算出来的九种画像之一（沉思求定型、城堡守护型、知行果敢型……）。可以编辑昵称、微信号和修性宣言，一键复制微信号发给同修好友  •  每日修炼打卡 ：写一句今天的修炼感悟，记录打卡足迹，每天一次，累积成你的修行日历  •  领取电子书 ：内置《内心的修炼 v4 灵魂之觅版》完整版，可选 TXT（微信聊天里点开直接读，零门槛）或 EPUB（微信读书等阅读器打开）  •  关于本页 ：查看当前发布版本、资产统计和核心生态    七、双小程序联动与公众号生态  「内心的修炼」不是孤岛，它和「灵魂之觅」小程序、公众号「美好需要创造」组成了一个小生态：  •  内心的修炼 ：8 问快速自测 + 九关修炼 + 数字百宝箱  •  灵魂之觅 ：36 问深度版 + 情感 DNA 报告 + 配对聊天，两个小程序互相跳转，名片画像数据打通  •  公众号「美好需要创造」 ：文章合集、有声书专辑、《内心的修炼》更新动态、免费资源开放通知  在修炼页、灵魂之觅页和我的页都能看到公众号二维码，长按识别即可关注。    八、三分钟上手清单  如果你是第一次打开，按这个顺序走一遍：  • 1. 微信搜一搜「内心的修炼」，进入小程序  • 2. 切到「灵魂之觅」Tab，答完 8 问，拿到诊断和处方  • 3. 按诊断跳进对应关卡，读使命，勾当日觉察  • 4. 点「AI 陪练」，问导师一个你真正卡住的问题  • 5. 回「结善缘」页面打卡，写下今天的感悟  • 6. 逛「百宝箱」搜索关键词，试试「AI 智能推荐」  • 7. 到「免费领」领一份免费工具  • 8. 在「我的」领电子书，长按二维码关注公众号，收听有声书    九、写在最后  这个小程序没有复杂的注册、没有付费墙，打开就能用。它给你的不是一堆「正确的道理」，而是一条有顺序、有反馈、有 AI 陪练的实操路径。  你以什么样的逻辑认识世界，就吸收什么样的养分；吸收了什么，就会向外生长、发射出什么样的东西。  如果你也常常「道理都懂、就是做不到」，不妨从 8 问自测开始，看看自己卡在第几关。你现在的卡点，是断舍离、立根本、炼心术，还是别的？评论区告诉我，或者直接打开小程序测一测。  \n\n ↓ 长按识别小程序码，把第一道题，发给那个你想走近的人 \n   \n\n 「灵魂之觅」· 基于心理学家亚瑟·阿伦的 36 问 ｜ 慢一点，认真认识一个人 \n \n", "mtime": 1787118795, "size": 15665}, {"path": "docs/公众号文章/天兵助手/公众号推广文章_天兵助手全指南.html", "title": "公众号推广文章_天兵助手全指南", "text": " \n\n ✦ 小程序 \n\n 天兵助手小程序全指南：九关修炼 × 80+ 项数字资产，一个微信小程序全搞定  读了很多道理，日子还是老样子？不是你不够努力，而是你读过的每一本书、听过的每一个故事，都还只是「听过」，没有被拆解、重铸成你自己的东西。今天介绍一个把「修心」和「工具箱」同时装进微信的小程序——天兵助手。   一、它是什么  天兵助手（品牌名「内心的修炼 · 数字百宝箱」）是公众号「美好需要创造」出品的微信小程序。它把两件事装进了一个入口：  •  一套身心社财四层生存  1786863820, "size": 887}, {"path": "docs/公众号文章/灵魂之觅/mpaudio_第三辑_21-30.html", "title": "mpaudio_第三辑_21-30", "text": " \n ✦ 灵魂之觅 · 幸福的内在 \n 《幸福的内在》· 第三辑（第 21–30 集）  从《天堂地狱》到《两种悲痛》，这一辑走到更深的地方——关于失去、选择与爱。 \n \n  \n\n  \n\n  \n\n  \n\n  \n\n  \n\n  \n\n  \n\n  \n\n  \n \n 《幸福的内在》· 世界一隅 WORLD CORNER \n ", "mtime": 1787482779, "size": 6091}, {"path": "docs/公众号文章/灵魂之觅/mpaudio_第二辑_11-20.html", "title": "mpaudio_第二辑_11-20", "text": " \n ✦ 灵魂之觅 · 幸福的内在 \n 《幸福的内在》· 第二辑（第 11–20 集）  从《我们的哥伦布》到《夏洛的网》，继续听幸福从哪里来。建议收藏，今晚从头听起。 \n \n  \n\n  \n\n  \n\n  \n\n  \n\n  \n\n  \n\n  \n\n  \n\n  \n \n 《幸福的内在》· 世界一隅 WORLD CORNER \n ", "mtime": 1787482779, "size": 6268}, {"path": "docs/公众号文章/灵魂之觅/mpaudio_终章_31.html", "title": "mpaudio_终章_31", "text": " \n ✦ 灵魂之觅 · 幸福的内在 \n 《幸福的内在》· 终章  第 31 集《升维》。最后一步：幸福不是等来的，是长出来的。 \n \n  \n \n 《幸福的内在》· 世界一隅 WORLD CORNER \n ", "mtime": 1787482779, "size": 1218}, {"path": "docs/公众号文章/灵魂之觅/公众号宣传文_幸福的内在_31集.html", "title": "公众号宣传文_幸福的内在_31集", "text": " \n\n ✦ 情感 · 心理 · 深度关系 \n\n 幸福，是可以被问出来的 \n ——《幸福的内在》31 集完整收录，今晚就能听；灵魂之觅 36 问，今晚就能答。 \n\n \n幸福，不是外面递给你的安逸； \n幸福，是内在的精神和思想活动，结出来的果子。\n \n\n \n 一、有人已经在追问：幸福到底是什么？ \n 有一位数学家叫欧拉，一辈子都在算数学。那些公式和符号，在普通人眼里又冷又硬，可他说：每次在数学里发现一条新的真理，他从头到脚，都会充满一种极大的愉悦。那不是赚到钱的高兴，也不是被人夸奖的高兴，是一种 被光照亮了似的高兴 。 \n 柏拉图说得更早：人应该「爱智慧」。在柏拉图看来，智慧是灵魂的粮食，一颗灵魂去追真理的时候，它是活的、有热度的——这个过程本身，就是幸福的体验。苏格拉底则丢下一句狠话：「未经审视的人生，不值得过。」 \n 尼采讲过同样硬的话：「只要知道为何而活，就能忍受几乎任何苦难。」同样是被生活捶打，为什么有人是在受苦，有人是在过关？区别就在于——心里有没有那个「为何」。 \n 把这几个人放在一起看，你会发现一件很有意思的事：他们都在说同一句话—— 幸福，不是等来的，也不是外面递给你的。 它是你想明白一件事、想通一个问题时，心里亮起来的那一下。这个「亮」，才是幸福真正的模样。 \n 而这本叫《幸福的内在》的有声书，就是沿着这条路，一集一集讲清楚：思想是怎么成为粮食的，说出来的思想为什么更接近真相，以及——一个普通人的内心，是怎么一点点建设出幸福的。 \n 从《思想之光》到《升维》，一共 31 集。每集只有几分钟，不用下载、不用注册，点开就能听。我们把它全部放在这篇文章里了。 \n \n\n \n 二、《幸福的内在》31 集，都在这里 \n \n建议先收藏这篇文章，从第 1 集开始，跟着走向最后；也可以从你好奇的那一集直接听起。每一集，都是一个「想明白」的时刻。\n \n \n  \n\n  \n\n  \n\n  \n\n  \n\n  \n\n  \n\n  \n\n  \n\n  \n \n \n\n \n 三、知道了幸福从哪儿来，那人心怎么靠近？ \n 1997 年，纽约州立大学的心理学家亚瑟·阿伦（Arthur Aron）做了一个实验：让互不相识的陌生人两两配对，轮流回答 36 个问题——从「你希望邀请谁共进晚餐」这种轻松的开场，一步步走到「你最珍贵、最想分享的回忆」「你最后悔没说出口的话」。 \n 实验结果出人意料：仅仅 45 分钟的共同问答，陌生人之问就长出了堪比数月友谊的亲密感。部分参与者在实验后甚至开始约会、相爱。 \n 这组问题后来被称为 「爱的 36 问」 。它的秘密不在于「问了什么」，而在于创造了一条安全的、循序渐进的袒露路径——先说一点，再多一些，最后把最深处也交出去。当两个人一起走过这段路，某种坚固的东西就长出来了。 \n 而「灵魂之觅」这个小程序，就是把这套被验证了 30 年的方法，放进了你的手机里。 \n \n\n \n 四、灵魂之觅，怎么用？ \n 一句话：一个陪你慢下来、认真认识自己，也认真认识那个人的小程序。不需要注册、不用填资料，打开就能开始。 \n\n  第 1 步 · 先认识自己：3 分钟速测  \n 第一次进来不用有压力。先随机答 3 道题，AI 会结合心理学加权算法，给你一个初步的情感类型判定： 连接型、探索型、表达型、守护型、创造型 ——你是哪一种灵魂，先有个轮廓，还可以生成一张好看的情感人格分享卡。 \n\n  第 2 步 · 认真认识一个人：双人配对，答案互看  \n 生成一个邀请码，发给那个你想深度了解的人——恋人、朋友、闺蜜、兄弟。TA 加入后，你们回答同一组 36 问， 每天只解锁一道 ，晚上 9 点准时进入「安静时间」，关掉杂音，认真答一题。 \n 这里有个关键设计： 只有双方都答过同一道题，才能互相看到对方的答案。 你的回答永远不会单方面被看光——你们是同步走向彼此的，不是在互相审问。 \n 配对成功后可以直接聊天：文字、语音、20 个暖心情态表情、引用回复、2 分钟撤回，还有「 情感胶囊 」——把一句想留给 TA 的话封存成一颗特殊气泡投过去。聊卡住了？点一下「 灵魂提问卡 」，系统会把下一道 36 问一键递给 TA，对话永远接得上。 \n 如果你暂时没有特定的人选，首页的「灵魂寻觅」会为你精选 3 位高契合度的灵魂——不看脸，看灵魂底色，附一句破冰邀约。 \n\n  第 3 步 · 收到两份报告：看见自己，也看见彼此  \n 答完题，你会拿到一份 情感 DNA 报告 ：五大情感维度（开放度、深度、温度、理性、表达力）雷达图 + AI 个性化分析。两个人共同答过至少 5 道题后，可以生成 双人兼容性报告 ——不是星座玄学，是基于双方真实回答算出来的：哪里同频，哪里互补，哪里需要磨合，报告会一处处告诉你。 \n\n  一个人的时候，也有去处  \n 不配对也没关系。每天的「今日心情」记录、音频修炼（就是上面这本《幸福的内在》）、心流沉静音律、纪念日提醒，甚至睡前的一小段引导催眠放松——都可以当成你的安静角落。 \n\n  关于隐私，说清楚  \n 答案只有你和配对的那个人能看到；数据加密传输； 没有广告、不卖数据、不制造焦虑 ；遇到不适的人可以一键屏蔽举报；想告别时，「彻底销毁聊天记录」会把双方数据从云端物理删除——来去自由，是这份关系最基本的尊重。 \n \n\n \n 五、为什么值得你花这几分钟？ \n 1.  方法是真的。 36 问来自被验证了 30 年的心理学实验，不是玄学，不需要你信什么。 \n 2.  收获是立刻的。 3 分钟速测就有结果；今晚就能听完 31 集的《幸福的内在》——先把心静下来，再开口。 \n 3.  慢，是故意的。 一天一题，给思考留呼吸。关系不是靠一晚聊完的，是靠一天天聊出来的。 \n 4.  双向，才安全。 答案互看——没人会被单方面看光，每一步都是两个人同步走的。 \n 5.  一个人也能用。 没有对象、没有搭档，先好好认识自己，一样值得。 \n 丑话也直说：它不帮你脱单，也不承诺「答完 36 问就相爱」。它只是把门推开—— 剩下的路，要你们自己走。  \n \n\n \n 六、三步开始 \n 第一步：微信搜索小程序「灵魂之觅」，或扫文末小程序码； \n 第二步：做一次 3 分钟速测，拿到你的情感类型； \n 第三步：想找个人一起——生成邀请码发给 TA；想自己探索——直接开始每日一问。 \n 今晚九点以后，是答题最好的时间。安静下来，认真答第一题。 \n \n\n \n有些话，问了才有答案； \n有些人，问了才真正认识。 \n36 个问题之后，你们要么更近，要么更清楚。\n \n\n ↓ 长按识别小程序码，把第一道题，发给那个你想走近的人 \n   \n\n 「灵魂之觅」· 基于心理学家亚瑟·阿伦的 36 问 ｜ 慢一点，认真认识一个人 \n\n ✦ 美好需要创造 · 世界一隅 WORLD CORNER \n \n", "mtime": 1787482779, "size": 17751}, {"path": "docs/公众号文章/灵魂之觅/公众号推广文章.html", "title": "公众号推广文章", "text": " \n \n 情感 · 心理 · 深度关系 \n\n 我们聊了一整晚，却从来没真正认识过彼此 \n\n 一、你有没有过这样的时刻？ \n 微信里躺着想说话的人，对话框打开又关上，最后只发了一句「在吗」。 \n 我们拥有前所未有的连接工具，却越来越难完成一次真正的「交心」。 \n 饭局上举杯碰杯，散场后各自刷手机；恋爱谈了很久，却从没认真问过对方——「你最害怕失去什么」「你最珍贵的回忆是什么」。 \n 不是不想聊，是不知道： 该怎么开始一场不尴尬的、深入的对话。  \n 朋友圈越刷越热闹，心里却越来越空。我们都在等一个机会，把那些「想说又没说出口」的话，轻轻递到某个人面前。 \n\n 二、1997 年，一位心理学家做了一个实验 \n 纽约州立大学的心理学家  亚瑟·阿伦（Arthur Aron）  设计了一组  36 个问题 。 \n 他把互不相识的陌生人两两配对，让他们轮流回答这 36 道题——从「你希望邀请谁共进晚餐」这种轻松的开场，一步步深入到「你最后悔没说出口的话是什么」「你家人中谁的离世最让你难过」。 \n 实验结果出人意料： \n 仅仅 45 分钟的共同问答，就让两个陌生人之间产生了堪比数月友谊的亲密感。部分参与者甚至在实验后约会、相爱。 \n 这组问题后来被称为  「爱的 36 问」 。它的秘密不在于「问了什么」，而在于创造了一种安全的、循序渐进的袒露——先说一点，再多一些，最后把最深处也交出去。当两个人一起走过这段路，某种坚固的东西就长出来了。 \n  「灵魂之觅」 ，就是把这个经典心理学实验，做成了你手机里的一个小程序。 \n\n 三、灵魂之觅，到底是什么？ \n 一句话： 一个陪你慢下来、认真认识自己，也认真认识那个人的小程序。  \n 不需要注册、不用填资料。打开它，从一次 3 道题的「入门速测」开始—— \n 它会从 36 题里，随机抽 3 道（每组各 1 道：轻松的、深入的、最深的），请你凭直觉回答。三道题答完，小程序会用  AI 情感分析 （接入 DeepSeek 大模型），读出你藏在字里行间的情感倾向，为你生成一张专属情感人格卡片： \n 🌿  连接型 ——关系驱动，渴望深度连接与真诚分享 🔭  探索型 ——对世界和自我充满好奇，不断追问意义 🎨  表达型 ——情感丰富而真实，用表达与创造连接世界 🛡️  守护型 ——重视承诺与安全，是关系里可靠温暖的守护者 💡  创造型 ——想象力丰沛，在关系里寻求独特与新鲜感 \n （如果 AI 暂时不可用，小程序也会用内置的心理学加权算法兜底，保证你一定能拿到结果。） \n 拿到卡片的那一刻，很多人会说一句：「原来我是这样的人。」这不是贴标签，而是给你一面镜子—— 你一直以来的相处方式，原来是有名字的。  \n 而且，这张卡片可以直接生成漂亮的分享图，一键发给朋友、发到朋友圈：「来测测我们的情感类型是不是一对。」 \n\n 四、它的特别之处，在于「慢」 \n 别的 app 追求日活、追求刷不完的信息流。灵魂之觅反其道而行： 36 道题，每天只为你解锁一道。  \n · 36 题分成三组，由浅入深： 　 第一组「初步了解」（1–12 题） ：从「完美的一天是怎样的」到「你人生中最感激的是什么」； 　 第二组「深入探索」（13–24 题） ：从「你最珍贵的回忆」到「你与母亲的关系」； 　 第三组「深层暴露」（25–36 题） ：从「说三句以『我们』开头的话」到「分享一个私人问题，请对方给你建议」。 \n · 每天一题，给思考留出呼吸的空间，不让你一口气刷完就忘； ·  晚上 9 点之后 ，它会温柔地提醒你进入「安静时间」——关掉杂音，认真答一道； · 它会记录你的 连续探索天数（打卡 streak） ，像一个小小火种，陪你一天天坚持下去； · 每答完一组，你都能看到自己的进度、连续天数，还有一幅属于你的  情感 DNA 雷达图 ——五个维度（开放度、深度、温度、理性、表达力），画出了你独一无二的轮廓。 \n 它不催你，也不制造焦虑。它默认： 真正的认识，急不来。  \n\n 五、但最动人的，是「两个人一起」 \n 一个人的探索，是认识自己。 两个人的探索，才是靠近彼此。  \n\n 1）两种配对方式，总有一种适合你 \n  方式 A：专属邀请码  在「好友配对」页面，生成一个 8 位邀请码（也可以直接生成一张带码的分享卡片）。把它发给那个你想走近的人——恋人、朋友、闺蜜、兄弟。对方输入邀请码，你们就结成了一份专属的 1 对 1 灵魂配对。 \n  方式 B：灵魂寻觅 · 算法精选匹配  如果你暂时没有特定的人选，首页有一个「灵魂寻觅」入口。点开，算法会为你精选 3 位高契合度的灵魂（展示契合度评分、3 个共同契合点标签，以及一句破冰邀约，比如「你们都渴望温暖而安稳的陪伴，聊聊你们最难忘的陪伴经历吧」）。看对眼了，一键「开启缘分」，立刻建立配对、进入对话。 \n\n 2）答案互看：只有彼此都答过，才彼此解锁 \n 这是设计里最温柔也最安全的一环：你们答着同一组问题。每道题，都遵循一个规则—— 只有你们两个人都答过同一道题，才能互相看到对方的答案 。于是会出现这样的瞬间： \n 「原来他最珍惜的，是那个下雨天。」 「原来她和我一样，害怕被不重要的人决定人生。」 \n 那些平日里说不出口、怕被笑的话，借着题目的名义，自然地说了出来。你不是在「查岗」，你们是在 交换真心 。 \n\n 3）真正能聊起来的对话空间 \n 配对成功后，你们进入一个真实的双向聊天室。它不像冷冰冰的客服窗口，而像深夜躺在床上的那通电话—— \n · 💬  发文字、发图片、发表情 ：20 个暖心表情随心选（💞🥰🥺🫂🌙……）； · 🎤  按住说话 ：按住录音，上滑取消，松手发送，语音条可点开反复听； · 💊  情感胶囊 ：把一句想留给 TA 的温情寄语，「封存」成一颗特殊样式的气泡投过去——它和日常消息不一样，更像一枚被认真放下的心意； · 🃏  灵魂提问卡 ：聊卡住的时候，点一下「灵魂提问卡」，系统会把下一道还没发的 36 问一键递给 TA（例如：「第 28 题：告诉对方你喜欢他/她的什么，这次要非常诚实」），对方收到后认真作答，再告诉你答案——话题永远不断； · 💬  引用回复 ：长按任意一条消息，可以「引用」它接着说，对话有来有回，不再错位； · ↩️  消息撤回 ：说错的话，2 分钟内可撤回； · ⚡  实时送达 ：消息用微信云数据库的实时监听（watch）推送，对方一发出，你这边几乎立刻浮现；即便网络波动，也有轮询兜底，不会漏掉； · 🔔  微信服务通知 ：开启后，TA 给你发消息，哪怕你不在小程序里，也能收到微信的离线提醒。 \n 而且，聊天里还埋了一个顶部「共同话题锚点」——点一下，会弹出你们当前进度对应的那道 36 问，你可以选择「引用这道题打字」，或者直接「把它发给 TA」，让深度对话顺着题目的脉络自然流动。 \n\n 六、当你们答得足够多，会收到一份「双人兼容报告」 \n 这不是那种「匹配度 87%」的噱头数字。当你们共同答完的题目达到  至少 5 道  时，小程序会用一套扎实的 NLP 兼容算法，基于你们真实的答案，算出一份双人报告： \n ·  关键词重叠度（Jaccard 相似度，权重 35%） ：你们在表达里用了多少相似的关键词？话题关注点是否重合？ ·  答案长度相关性（Pearson 相关系数，权重 20%） ：你们回答的深度是否同步？当一方深入，另一方是否也给予同等认真的回应？ ·  情感极性匹配（Cosine 相似度，权重 25%） ：你们在积极与消极情绪的平衡上是否协调？ ·  问题组加权（权重 20%） ：越深的题（第三组权重最高），对结果影响越大——浮于表面的相似不算数，敢暴露的默契才作数。 \n 最终报告会给出：一个综合兼容分数（1–99）；三个维度： 连接度 / 共鸣度 / 深度匹配 ；以及几句真正读懂你们的洞察，例如： \n 「你们在表达中使用了许多相似的关键词，话题关注点高度重合。」 「回答深度高度同步——当一方深入思考时，另一方也会给予同等深度的回应。」 「情感表达高度和谐，你们在积极和消极情绪的平衡上非常一致。」 \n 它不评判「合不合适」，它只是 把你们关系的质地，清晰地摊开在你们面前 ——哪些地方彼此呼应，哪些地方恰好互补。 \n\n 七、把对话，变成可以珍藏的「回忆录」 \n 聊得深了，你会舍不得这些对话。在小程序右上角的菜单里，有一个温柔的功能： 「导出灵魂对话回忆录海报」 。一键把你们共同走过的题目、说过的话，凝成一张可以保存、可以回看的纪念图。 \n 关系会流动，但这些被认真对待过的瞬间，值得被留下来。当然，如果你哪天想彻底告别——菜单里也能 「彻底销毁当前聊天记录」 ：双方数据从云端物理删除，不可恢复。来去自由，是这份关系最基本的尊重。 \n\n 八、关于隐私，我们很认真 \n 袒露是脆弱的。所以「安全」被写进了产品的每一处设计： \n · 你的答案，只有你和 配对的那一个人 能看到； · 只有你们都答过同一题，才能互相解锁查看答案——没有人能单方面窥探你； · 数据全程加密传输，你可以随时清除本地与云端的记录； ·  没有广告、不卖数据、不制造焦虑 ； · 如果遇到不适的人，菜单内支持 一键屏蔽与举报 。 \n 这里没有围观者。只有你和那个被你邀请来的人。 \n\n 九、还有一处安静的角落：催眠放松 \n 除了对话，小程序里还藏着一个辅助功能—— 催眠放松 。当你想先把自己安顿下来，再开口聊的时候，可以来这里，用一段引导式的放松，把白天卸下来。（适合睡前、答最深那组题之前，先让自己安静下来。） \n\n 十、所以，它适合谁？ \n · 💞 想和伴侣重新「聊起来」的人 · 👯 有一个想更懂的朋友、闺蜜、兄弟 · 🌱 想先好好认识自己的人 · ✍️ 喜欢记录、喜欢慢思考的人 · 🔮 暂时没有特定对象，但愿意让算法帮你遇见一个「高契合度灵魂」的人 \n 它未必能让你瞬间爱上谁。但它很可能，让你和某个人之间，多出一段 值得反复回味的对话 ；让你在某一刻忽然发现—— \n 「原来，被人认真听懂，是这种感觉。」 \n\n 十一、现在，给自己一个慢下来的理由 \n 今晚 9 点之后，找个安静的角落。打开「灵魂之觅」，从第一题开始。 \n 如果你愿意，把邀请码发给那个一直想靠近的人。 你们的故事，可以从一道题开始。 \n 👇 长按识别小程序码，开始你的 36 问 \n   \n\n 灵魂之觅 · 用心思考，深度对话，探索真实的自己 © 2024 灵魂之觅 \n \n", "mtime": 1786866932, "size": 17854}, {"path": "docs/公众号文章/灵魂之觅/公众号推广文章.md", "title": "公众号推广文章", "text": "  灵魂之觅 · 公众号推广文章（详尽版）\n\n  适用场景：情感类 / 心理类 / 生活方式类微信公众号深度推文\n  配图建议：\n    封面用「深夜窗边、两个人对坐、影子交错」氛围图\n    文中插入小程序码  images/qrcode.png  或  images/soul experience qr.png \n    DNA报告、兼容报告可放产品截图（如有）\n\n \n\n  标题备选（按风格挑选）\n\n1.  我们聊了一整晚，却从来没真正认识过彼此 \n2.  心理学家说：认真答完这 36 个问题，你们会离彼此更近一步 \n3.  在这个秒回都嫌慢的时代，我们替你慢下来，好好聊一次 \n4.  据说，愿意和你一起答完 36 问的人，是真的很想懂你 \n5.  灵魂之觅：一场关于「被真正听懂」的温柔实验 \n\n \n\n  正文\n\n  一、你有没有过这样的时刻？\n\n微信里躺着想说话的人，对话框打开又关上，最后只发了一句「在吗」。\n\n我们拥有前所未有的连接工具，却越来越难完成一次真正的「交心」。\n\n饭局上举杯碰杯，散场后各自刷手机；\n恋爱谈了很久，却从没认真问过对方——「你最害怕失去什么」「你最珍贵的回忆是什么」。\n\n不是不想聊，是不知道： 该怎么开始一场不尴尬的、深入的对话。 \n\n朋友圈越刷越热闹，心里却越来越空。我们都在等一个机会，把那些「想说又没说出口」的话，轻轻递到某个人面前。\n\n \n\n  二、1997 年，一位心理学家做了一个实验\n\n纽约州立大学的心理学家  亚瑟·阿伦（Arthur Aron）  设计了一组  36 个问题 。\n\n他把互不相识的陌生人两两配对，让他们轮流回答这 36 道题——从「你希望邀请谁共进晚餐」这种轻松的开场，一步步深入到「你最后悔没说出口的话是什么」「你家人中谁的离世最让你难过」。\n\n实验结果出人意料：\n\n  仅仅 45 分钟的共同问答，就让两个陌生人之间产生了堪比数月友谊的亲密感。部分参与者甚至在实验后约会、相爱。\n\n这组问题后来被称为  「爱的 36 问」 。\n\n它的秘密不在于「问了什么」，而在于  创造了一种安全的、循序渐进的袒露 ——先说一点，再多一些，最后把最深处也交出去。当两个人一起走过这段路，某种坚固的东西就长出来了。\n\n 「灵魂之觅」 ，就是把这个经典心理学实验，做成了你手机里的一个小程序。\n\n \n\n  三、灵魂之觅，到底是什么？\n\n一句话： 一个陪你慢下来、认真认识自己，也认真认识那个人的小程序。 \n\n不需要注册、不用填资料。打开它，从一次 3 道题的「入门速测」开始——\n\n它会从 36 题里，随机抽 3 道（每组各 1 道：轻松的、深入的、最深的），请你凭直觉回答。三道题答完，小程序会用  AI 情感分析 （接入 DeepSeek 大模型），读出你藏在字里行间的情感倾向，为你生成一张 专属情感人格卡片 ：\n\n🌿  连接型 ——关系驱动，渴望深度连接与真诚分享\n🔭  探索型 ——对世界和自我充满好奇，不断追问意义\n🎨  表达型 ——情感丰富而真实，用表达与创造连接世界\n🛡️  守护型 ——重视承诺与安全，是关系里可靠温暖的守护者\n💡  创造型 ——想象力丰沛，在关系里寻求独特与新鲜感\n\n（如果 AI 暂时不可用，小程序也会用内置的心理学加权算法兜底，保证你一定能拿到结果。）\n\n拿到卡片的那一刻，很多人会说一句：「原来我是这样的人。」\n这不是贴标签，而是给你一面镜子—— 你一直以来的相处方式，原来是有名字的。 \n\n而且，这张卡片可以直接生成漂亮的 分享图 ，一键发给朋友、发到朋友圈：「来测测我们的情感类型是不是一对。」\n\n \n\n  四、它的特别之处，在于「慢」\n\n别的 app 追求日活、追求刷不完的信息流。\n灵魂之觅反其道而行： 36 道题，每天只为你解锁一道。 \n\n  36 题分成三组，由浅入深：\n     第一组「初步了解」（1–12 题） ：从「完美的一天是怎样的」到「你人生中最感激的是什么」；\n     第二组「深入探索」（13–24 题） ：从「你最珍贵的回忆」到「你与母亲的关系」；\n     第三组「深层暴露」（25–36 题） ：从「说三句以『我们』开头的话」到「分享一个私人问题，请对方给你建议」。\n  每天一题，给思考留出呼吸的空间，不让你一口气刷完就忘；\n   晚上 9 点之后 ，它会温柔地提醒你进入「安静时间」——关掉杂音，认真答一道；\n  它会记录你的 连续探索天数（打卡 streak） ，像一个小小火种，陪你一天天坚持下去；\n  每答完一组，你都能看到自己的进度、连续天数，还有一幅属于你的  情感 DNA 雷达图 ——五个维度（开放度、深度、温度、理性、表达力），画出了你独一无二的轮廓。\n\n它不催你，也不制造焦虑。它默认： 真正的认识，急不来。 \n\n \n\n  五、但最动人的，是「两个人一起」\n\n一个人的探索，是认识自己。\n 两个人的探索，才是靠近彼此。 \n\n  1）两种配对方式，总有一种适合你\n\n 方式 A：专属邀请码 \n在「好友配对」页面，生成一个  8 位邀请码 （也可以直接生成一张带码的分享卡片）。把它发给那个你想走近的人——恋人、朋友、闺蜜、兄弟。对方输入邀请码，你们就结成了一份 专属的 1 对 1 灵魂配对 。\n\n 方式 B：灵魂寻觅 · 算法精选匹配 \n如果你暂时没有特定的人选，首页有一个「灵魂寻觅」入口。点开，算法会为你 精选 3 位高契合度的灵魂 （展示契合度评分、3 个共同契合点标签，以及一句破冰邀约，比如「你们都渴望温暖而安稳的陪伴，聊聊你们最难忘的陪伴经历吧」）。看对眼了，一键「开启缘分」，立刻建立配对、进入对话。\n\n  2）答案互看：只有彼此都答过，才彼此解锁\n\n这是设计里最温柔也最安全的一环：\n\n你们答着同一组问题。每道题，都遵循一个规则—— 只有你们两个人都答过同一道题，才能互相看到对方的答案 。\n\n于是会出现这样的瞬间：\n  「原来他最珍惜的，是那个下雨天。」\n  「原来她和我一样，害怕被不重要的人决定人生。」\n\n那些平日里说不出口、怕被笑的话，借着题目的名义，自然地说了出来。你不是在「查岗」，你们是在 交换真心 。\n\n  3）真正能聊起来的对话空间\n\n配对成功后，你们进入一个 真实的双向聊天室 。它不像冷冰冰的客服窗口，而像深夜躺在床上的那通电话——\n\n  💬  发文字、发图片、发表情 ：20 个暖心表情随心选（💞🥰🥺🫂🌙……）；\n  🎤  按住说话 ：按住录音，上滑取消，松手发送，语音条可点开反复听；\n  💊  情感胶囊 ：把一句想留给 TA 的温情寄语，「封存」成一颗特殊样式的气泡投过去——它和日常消息不一样，更像一枚被认真放下的心意；\n  🃏  灵魂提问卡 ：聊卡住的时候，点一下「灵魂提问卡」，系统会把下一道还没发的 36 问 一键递给 TA （例如：「第 28 题：告诉对方你喜欢他/她的什么，这次要非常诚实」），对方收到后认真作答，再告诉你答案——话题永远不断；\n  💬  引用回复 ：长按任意一条消息，可以「引用」它接着说，对话有来有回，不再错位；\n  ↩️  消息撤回 ：说错的话，2 分钟内可撤回；\n  ⚡  实时送达 ：消息用微信云数据库的实时监听（watch）推送，对方一发出，你这边几乎立刻浮现；即便网络波动，也有轮询兜底，不会漏掉；\n  🔔  微信服务通知 ：开启后，TA 给你发消息，哪怕你不在小程序里，也能收到微信的离线提醒。\n\n而且，聊天里还埋了一个 顶部「共同话题锚点」 ——点一下，会弹出你们当前进度对应的那道 36 问，你可以选择「引用这道题打字」，或者直接「把它发给 TA」，让深度对话顺着题目的脉络自然流动。\n\n \n\n  六、当你们答得足够多，会收到一份「双人兼容报告」\n\n这不是那种「匹配度 87%」的噱头数字。\n\n当你们共同答完的题目达到  至少 5 道  时，小程序会用一套扎实的  NLP 兼容算法 ，基于你们真实的答案，算出一份双人报告：\n\n   关键词重叠度（Jaccard 相似度，权重 35%） ：你们在表达里用了多少相似的关键词？话题关注点是否重合？\n   答案长度相关性（Pearson 相关系数，权重 20%） ：你们回答的深度是否同步？当一方深入，另一方是否也给予同等认真的回应？\n   情感极性匹配（Cosine 相似度，权重 25%） ：你们在积极与消极情绪的平衡上是否协调？\n   问题组加权（权重 20%） ：越深的题（第三组权重最高），对结果影响越大——浮于表面的相似不算数，敢暴露的默契才作数。\n\n最终报告会给出：\n\n  一个  综合兼容分数 （1–99）；\n  三个维度： 连接度 / 共鸣度 / 深度匹配 ；\n  几句 真正读懂你们的洞察 ，例如：\n    「你们在表达中使用了许多相似的关键词，话题关注点高度重合。」\n    「回答深度高度同步——当一方深入思考时，另一方也会给予同等深度的回应。」\n    「情感表达高度和谐，你们在积极和消极情绪的平衡上非常一致。」\n\n它不评判「合不合适」，它只是 把你们关系的质地，清晰地摊开在你们面前 ——哪些地方彼此呼应，哪些地方恰好互补。\n\n \n\n  七、把对话，变成可以珍藏的「回忆录」\n\n聊得深了，你会舍不得这些对话。\n\n在小程序右上角的菜单里，有一个温柔的功能： 「导出灵魂对话回忆录海报」 。一键把你们共同走过的题目、说过的话，凝成一张可以保存、可以回看的纪念图。\n\n关系会流动，但这些被认真对待过的瞬间，值得被留下来。\n\n当然，如果你哪天想彻底告别——菜单里也能 「彻底销毁当前聊天记录」 ：双方数据从云端物理删除，不可恢复。来去自由，是这份关系最基本的尊重。\n\n \n\n  八、关于隐私，我们很认真\n\n袒露是脆弱的。所以「安全」被写进了产品的每一处设计：\n\n  你的答案，只有你和 配对的那一个人 能看到；\n  只有你们都答过同一题，才能互相解锁查看答案——没有人能单方面窥探你；\n  数据全程加密传输，你可以随时清除本地与云端的记录；\n   没有广告、不卖数据、不制造焦虑 ；\n  如果遇到不适的人，菜单内支持 一键屏蔽与举报 。\n\n这里没有围观者。只有你和那个被你邀请来的人。\n\n \n\n  九、还有一处安静的角落：催眠放松\n\n除了对话，小程序里还藏着一个辅助功能—— 催眠放松 。当你想先把自己安顿下来，再开口聊的时候，可以来这里，用一段引导式的放松，把白天卸下来。\n\n（适合睡前、答最深那组题之前，先让自己安静下来。）\n\n \n\n  十、所以，它适合谁？\n\n  💞 想和伴侣重新「聊起来」的人\n  👯 有一个想更懂的朋友、闺蜜、兄弟\n  🌱 想先好好认识自己的人\n  ✍️ 喜欢记录、喜欢慢思考的人\n  🔮 暂时没有特定对象，但愿意让算法帮你遇见一个「高契合度灵魂」的人\n\n它未必能让你瞬间爱上谁。\n但它很可能，让你和某个人之间，多出一段 值得反复回味的对话 ；让你在某一刻忽然发现——\n\n  「原来，被人认真听懂，是这种感觉。」\n\n \n\n  十一、现在，给自己一个慢下来的理由\n\n今晚 9 点之后，找个安静的角落。\n打开「灵魂之觅」，从第一题开始。\n\n  如果你愿意，把邀请码发给那个一直想靠近的人。\n  你们的故事，可以从一道题开始。\n\n👇 长按识别小程序码，开始你的 36 问\n\n（此处插入小程序码： images/qrcode.png  或  images/soul experience qr.png ）\n\n \n\n 灵魂之觅 · 用心思考，深度对话，探索真实的自己 \n\n © 2024 灵魂之觅 \n", "mtime": 1786610918, "size": 12673}, {"path": "docs/公众号文章/灵魂之觅/公众号推广文章_36个问题看见一个人的灵魂.html", "title": "公众号推广文章_36个问题看见一个人的灵魂", "text": " \n\n ✦ 情感 · 关系 \n\n 你有没有过这种时刻——  微信好友几百个，深夜想说话，翻遍通讯录却停下了手。和最亲近的人，聊天记录几千页，点开一看，全是「吃了吗」「到家没」「早点睡」。  我们越来越「熟」，却好像越来越不了解彼此。  ✦ 熟悉是重复出来的，了解是问出来的。   一、36个问题，一个著名的心理学实验  1997年，心理学家亚瑟·阿伦（Arthur Aron）做了一个实验：让两个陌生人面对面，互相回答36个由浅入深的问题——从「你理想中完美的一天是什么样的」，一路走到「如果你今晚就要离开这个世界，最后悔没说出口的话是什么」。  问题答完，两个人之间的距离，发生了真实的改变。这套问题后来被叫做「36问」，被无数文章引用过。  它没有套路，核心只有一条： 逐步深入的自我暴露 。一层一层，从轻松话题走到内心深处。亲密感，就是这样长出来的。    二、「灵魂之觅」：把36问做成了一个小程序  一句话介绍：这是一个把36问做成了 可以两个人一起玩 的微信小程序，名字叫「灵魂之觅」。  它不是又一个交友软件，不刷脸、不滑动、不搞算法速配。它只认真做一件事： 给愿意深度交流的两个人，一个慢慢了解彼此的场子。   下面说实话，讲讲它到底有什么。   1. 每日一问：一天只答一题  36个问题分三组，每组12题，从轻松到深刻层层递进。每天只解锁一题，答完要等第二天才能答下一题。  这个「慢」是故意的。36问的价值不在答完，而在想清楚——一天一题，每道题都有时间沉下去。  2. 3分钟速测：先知道自己是谁  第一次进来不用有压力。先随机答3道题，AI会给你一个初步的情感类型判定：连接型、探索型、表达型、守护型、创造型——你是哪一种灵魂，先有个轮廓。  3. 灵魂寻觅：契合星卡  基于你的答题数据，为你寻觅契合的灵魂，生成一张「契合星卡」，能看到你们之间的共同契合点。合不合适，不看脸，看灵魂底色。  4. 双人配对：答案互看，有规则的那种  生成一个邀请码，发给你想深度了解的那个人。TA加入后，两个人回答同一组36问。  这里有个关键设计： 只有双方都答过同一道题，才能互相看到对方的答案。 你的回答永远不会单方面被看光，你们是同步走向彼此的。  配对成功后，可以在小程序里直接聊天，还有一张「灵魂提问卡」——一键把下一道36问发给对方，把对话不断推向更深的地方。  ✦ 好的关系不是聊了多久，而是聊到了多深。  5. 情感DNA报告：你的灵魂画像  答完题，会生成你的情感DNA报告：五大情感维度的雷达图，加上AI基于你全部回答的个性化分析，还能生成分享图。你是一个什么样的人，答案里写着。  6. 双人兼容性报告：不是星座，是数据  两个人共同答过至少5道题之后，可以生成兼容性报告——不是按生日推的玄学，是基于双方真实回答算出来的契合度分析。你们在哪里同频，在哪里互补，哪里需要磨合，报告会告诉你。  7. 修心空间：一个人时也有去处  不配对也没关系，它也可以是你一个人的角落：  •  今日心情 ：每天记一笔，看见自己情绪的走向  •  音频修炼 ：内心修炼的听书内容  •  心流沉静 ：舒缓音律，帮你安静下来  •  纪念日 ：重要日子不再错过  ✦ 慢一点，是这个产品最大的功能。   三、实话实说的部分  丑话说在前面，这个小程序 不能帮你脱单 ，也不承诺「答完36问就能相爱」。它不替你制造感情，它只是把门推开——剩下的路，要你们自己走。  它适合这些人：  • 暧昧期，想更进一步又不知从何聊起  • 老夫老妻，想重新认识一遍身边这个人  • 好朋友，想让这段关系走得更深  • 一个人的你，想借36问好好看看自己  不适合的人也直说：想快速刷人、只想看脸配对的，这里没有你要的东西。    四、三步开始  •  第一步 ：微信搜索小程序「灵魂之觅」，或扫文末二维码  •  第二步 ：先做3分钟速测，拿到你的情感类型  •  第三步 ：想找个人一起——生成邀请码发给TA；想自己探索——直接开始每日一问  今晚九点以后，是答题的最好时间。安静下来，认真答第一题。  有些话，问了才有答案；有些人，问了才真正认识。  ✦ 36个问题之后，你们要么更近，要么更清楚。  ✦ 美好需要创造 世界一隅 · WORLD CORNER 2026.08.21  \n\n ↓ 长按识别小程序码，把第一道题，发给那个你想走近的人 \n   \n\n 「灵魂之觅」· 基于心理学家亚瑟·阿伦的 36 问 ｜ 慢一点，认真认识一个人 \n \n", "mtime": 1787315437, "size": 9704}, {"path": "docs/公众号文章/灵魂之觅/公众号推广文章_36问_深夜版.html", "title": "公众号推广文章_36问_深夜版", "text": " \n\n ✦ 情感 · 深夜 · 关系 \n\n 深夜的对话框，总有一段想说没说出口的话。1997 年，心理学家亚瑟·阿伦用 36 个问题，让陌生人彼此靠近——现在，有人把它做成了一个每天解锁一道题的小程序：灵魂之觅。它不催你，只陪你把那些「想说又没说出口」的话，轻轻递到某个人面前。 \n\n \n 一、你有没有过这样的深夜？ \n 手机亮着，对话框却静得可怕。 \n 你想说很多——今天的压力、童年的阴影、对未来的迷茫——但手指悬停，最后只打了一个「在吗」又删掉。 \n 我们身边早已有能聊天的工具，却越来越难有一次真正的「倾心」。饭局后各自刷手机，恋爱中却很少问：「你最害怕失去什么」「你生命中最重要的三件事是什么」。 \n 不是不想聊，是不知道：该怎么开始一场不尴尬、能深入的对话。 \n 朋友圈越热闹，心里却越空。我们都在等一个机会，把那些「想说又没说出口」的话，轻轻递到某个人面前。 \n \n\n \n 二、心理学家的实验：36 问，产生亲密 \n 1997 年，纽约州立大学的心理学家  亚瑟·阿伦（Arthur Aron）  设计了一组 36 个问题。 \n 他让互不相识的陌生人两两配对，轮流回答——从轻松的「你希望邀请谁共进晚餐」一步步深入到「你最后悔没说出口的话是什么」「你家人中谁的离世最让你难过」。 \n 结果惊人： \n • 仅 45 分钟的共同问答，就让陌生人之间产生了堪比数月友谊的亲密感；部分参与者甚至在实验后相爱。 \n 这组问题后来被称为  「爱的 36 问」 。 \n 它的力量不在于问了什么，而在于：创造了一种安全的、循序渐进的袒露——先说一点，再多一些，最后把最深处也交出去。两个人一起走过这段路，某种坚固的东西就会悄然长出来。 \n ✦ 金句：亲密不是靠运气，而是靠一个安全的机会，把真心一点点交出去。 \n \n\n \n 三、灵魂之觅：把经典心理实验装进你的手机 \n 一句话概括：一个陪你慢下来、认识自己、也认识对方的微信小程序。 \n 不需要注册、不用填资料。打开它，从一次 3 道题的「入门速测」开始—— \n 系统会从 36 题中，随机抽取 3 道（每组各 1 道：轻松的、深入的、最深的），请你凭直觉回答。三道题答完，小程序会调用 AI 情感分析（DeepSeek 大模型），读出你字里行间的情感倾向，为你生成一张专属情感人格卡片： \n 🌿  连接型 ——关系驱动，渴望深度连接与真诚分享 \n 🔭  探索型 ——对世界和自我充满好奇，不断追问意义 \n 🎨  表达型 ——情感丰富而真实，用表达与创造连接世界 \n 🛡️  守护型 ——重视承诺与安全，是关系里可靠温暖的守护者 \n 💡  创造型 ——想象力丰沛，在关系里寻求独特与新鲜感 \n （如果 AI 暂时不可用，内置的心理学加权算法会兜底，保证你一定能拿到结果。） \n 拿到卡片的那一刻，很多人会低声说：「原来我是这样的人。」这不是贴标签，而是给你一面镜子——你一直以来的相处方式，原来是有名字的。 \n 而且，这张卡片可以直接生成漂亮的分享图，一键发给朋友、发到朋友圈：「来测测我们的情感类型是不是一对。」 \n \n\n \n 四、它的特别之处，在于「慢」 \n 别的 App 追求日活、追求刷不完的信息流。灵魂之觅反其道而行： 36 道题，每天只为你解锁一道 。 \n 题目分三组，由浅入深： \n • 第一组「初步了解」（1–12 题）：从「完美的一天是怎样的」到「你人生中最感激的是什么」 \n • 第二组「深入探索」（13–24 题）：从「你最珍贵的回忆」到「你与母亲的关系」 \n • 第三组「深层暴露」（25–36 题）：从「说三句以『我们』开头的话」到「分享一个私人问题，请对方给你建议」 \n 每天一题，给思考留出呼吸的空间，不让你一口气刷完就忘； \n 晚上 9 点之后，它会温柔地提醒你进入 「安静时间」 ——关掉杂音，认真答一道； \n 它会记录你的 连续探索天数（打卡 streak） ，像一个小小火种，陪你一天天坚持下去； \n 每答完一组，你都能看到自己的进度、连续天数，还有一幅属于你的 情感 DNA 雷达图 ——五个维度（开放度、深度、温度、理性、表达力），画出你独一无二的轮廓。 \n ✦ 金句：它不催你，也不制造焦虑。它默认：真正的认识，急不来。 \n \n\n \n 五、但最动人的，是「两个人一起」 \n 一个人的探索，是认识自己。两个人的探索，才是靠近彼此。 \n  1）两种配对方式，总有一种适合你  \n • 方式 A：专属邀请码——在「好友配对」页面，生成一个 8 位邀请码（也可以直接生成一张带码的分享卡片）。把它发给那个你想走近的人——恋人、朋友、闺蜜、兄弟。对方输入邀请码，你们就结成了一份专属的 1 对 1 灵魂配对。 \n • 方式 B：灵魂寻觅 · 算法精选匹配——如果你暂时没有特定的人选，首页有一个「灵魂寻觅」入口。点开，算法会为你精选 3 位高契合度的灵魂（展示契合度评分、3 个共同契合点标签，以及一句破冰邀约，比如「你们都渴望温暖而安稳的陪伴，聊聊你们最难忘的陪伴经历吧」）。看对眼了，一键「开启缘分」，立刻建立配对、进入对话。 \n  2）答案互看：只有彼此都答过，才彼此解锁  \n 这是设计里最温柔也最安全的一环：你们答着同一组问题。每道题，都遵循一个规则—— 只有你们两个人都答过同一道题，才能互相看到对方的答案。  \n 于是会出现这样的瞬间： \n 「原来他最珍惜的，是那个下雨天。」 \n 「原来她和我一样，害怕被不重要的人决定人生。」 \n 那些平日里说不出口、怕被笑的话，借着题目的名义，自然地说了出来。你不是在「查岗」，你们是在交换真心。 \n  3）真正能聊起来的对话空间  \n 配对成功后，你们进入一个真实的双向聊天室。它不像冷冰冰的客服窗口，而像深夜躺在床上的那通电话—— \n 💬 发文字、发图片、发表情：20 个暖心表情随心选（💞🥰🥺🫂🌙……）； \n 🎤 按住说话：按住录音，上滑取消，松手发送，语音条可点开反复听； \n 💊 情感胶囊：把一句想留给 TA 的温情寄语，「封存」成一颗特殊样式的气泡投过去——它和日常消息不一样，更像一枚被认真放下的心意； \n 🃏 灵魂提问卡：聊卡住的时候，点一下「灵魂提问卡」，系统会把下一道还没发的 36 问一键递给 TA（例如：「第 28 题：告诉对方你喜欢他/她的什么，这次要非常诚实」），对方收到后认真作答，再告诉你答案——话题永不断； \n 💬 引用回复：长按任意一条消息，可以「引用」它再说，对话有来有回，不再错位； \n ↩️ 消息撤回：说错的话，2 分钟内可撤回； \n ⚡ 实时送达：消息用微信云数据库的实时监听（watch）推送，对方一发出，你这边几乎立刻浮现；即便网络波动，也有轮询兜底，不会漏掉； \n 🔔 微信服务通知：开启后，TA 给你发消息，哪怕你不在小程序里，也能收到微信的离线提醒。 \n 而且，聊天里还埋了一个顶部「共同话题锚点」：点一下，会弹出你们当前进度对应的那道 36 问，你可以选择「引用这道题打字」，或者直接「把它发给 TA」，让深度对话顺着题目的脉络自然流动。 \n \n\n \n 六、当你们答得足够多，会收到一份「双人兼容报告」 \n 这不是那种「匹配度 87%」的噱头数字。 \n 当你们共同答完的题目达到  至少 5 道  时，小程序会用一套扎实的 NLP 兼容算法，基于你们真实的答案，算出一份双人报告： \n • 关键词重叠度（Jaccard 相似度，权重 35%）：你们在表达里用了多少相似的关键词？话题关注点是否重合？ \n • 答案长度相关性（Pearson 相关系数，权重 20%）：你们回答的深度是否同步？当一方深入，另一方是否也给予同等认真的回应？ \n • 情感极性匹配（Cosine 相似度，权重 25%）：你们在积极与消极情绪的平衡上是否协调？ \n • 问题组加权（权重 20%）：越深的题（第三组权重最高），对结果影响越大——浮于表面的相似不算数，敢暴露的默契才作数。 \n 最终报告会给出： \n • 一个综合兼容分数（1–99）； \n • 三个维度：连接度 / 共鸣度 / 深度匹配； \n • 几句真正读懂你们的洞察，例如： \n 「你们在表达中使用了许多相似的关键词，话题关注点高度重合。」 「回答深度高度同步——当一方深入思考时，另一方也会给予同等深度的回应。」 「情感表达高度和谐，你们在积极和消极情绪的平衡上非常一致。」 \n ✦ 它不评判「合不合适」，它只是把你们关系的质地，清晰地摊开在你们面前——哪些地方彼此呼应，哪些地方恰好互补。 \n \n\n \n 七、把对话，变成可以珍藏的「回忆录」 \n 聊得深了，你会舍不得这些对话。 \n 在小程序右上角的菜单里，有一个温柔的功能： 「导出灵魂对话回忆录海报」 。一键把你们共同走过的题目、说过的话，凝成一张可以保存、可以回看的纪念图。 \n 关系会流动，但这些被认真对待过的瞬间，值得被留下来。 \n 当然，如果你哪天想彻底告别——菜单里也能 「彻底销毁当前聊天记录」 ：双方数据从云端物理删除，不可恢复。来去自由，是这份关系最基本的尊重。 \n \n\n \n 八、关于隐私，我们很认真 \n 袒露是脆弱的。所以「安全」被写进了产品的每一处设计： \n • 你的答案，只有你和配对的那一个人能看到； \n • 只有你们都答过同一题，才能互相解锁查看答案——没有人能单方面窥探你； \n • 数据全程加密传输，你可以随时清除本地与云端的记录； \n • 没有广告、不卖数据、不制造焦虑； \n • 如果遇到不适的人，菜单内支持一键屏蔽与举报。 \n ✦ 金句：这里没有围观者。只有你和那个被你邀请来的人。 \n \n\n \n 九、还有一处安静的角落：催眠放松 \n 除了对话，小程序里还藏着一个辅助功能——催眠放松。当你想先把自己安顿下来，再开口聊的时候，可以来这里，用一段引导式的放松，把白天卸下来。（适合睡前、答最深那组题之前，先让自己安静下来。） \n \n\n \n 十、所以，它适合谁？ \n 💞 想和伴侣重新「聊起来」的人 \n 👯 有一个想更懂的朋友、闺蜜、兄弟 \n 🌱 想先好好认识自己的人 \n ✍️ 喜欢记录、喜欢慢思考的人 \n 🔮 暂时没有特定对象，但愿意让算法帮你遇见一个「高契合度灵魂」的人 \n 图，发给对方：「看，这就是我。」 \n\n 六、所以，写给那个也想走近谁的人 \n 如果你也这样过—— \n 和一个人很近，却总觉得中间隔了点什么；想聊点深的，又怕空气突然安静；那些想说没说的话，在对话框里打了又删。 \n 不妨把「灵魂之觅」发给 TA。不用郑重其事，就像那天晚上我做的那样： \n 「无聊的话，陪我答一道题？」 \n 36 道题，一天一道。不保证你们会怎样，但它会给你们一个 重新认识彼此的理由 ，和一段只属于两个人的、慢慢聊起来的夜晚。 \n 毕竟，认识一个人，从来不是一次性的事。它是一道题，一道题，慢慢靠近的。 \n\n ↓ 长按识别小程序码，把第一道题，发给那个你想走近的人 \n   \n\n 「灵魂之觅」· 基于心理学家亚瑟·阿伦的 36 问 ｜ 慢一点，认真认识一个人 \n \n", "mtime": 1786866932, "size": 8330}, {"path": "docs/公众号文章/灵魂之觅/公众号推广文章_情感版.md", "title": "公众号推广文章_情感版", "text": "  我们睡在同一张床，却很久没好好聊过天了\n\n  一、那个普通的夜晚\n\n昨晚十一点，我和他并排躺在床上。\n\n他刷着短视频，肩膀一抖一抖地笑；我盯着天花板，手机亮了又灭。房间里很安静，安静得能听见他视频里的笑声，和我的呼吸。\n\n我们不是没话聊。只是「今天吃什么」「明天谁倒垃圾」说完了，再往下，就不知道怎么接了。那些真正想说的——我其实有点怕以后、我怀念外婆家的院子、我有时候觉得好累——卡在喉咙里，像一句没发出的微信，最后都变成了「睡吧」。\n\n后来我才知道，这叫「近在咫尺的陌生」。我们住在一起，却很久没有认真认识过彼此。\n\n  二、心理学家说：亲密，是可以被「设计」出来的\n\n1997 年，纽约州立大学的心理学家亚瑟·阿伦做了一件事。\n\n他找来互不相识的陌生人，两两配对，让他们轮流回答 36 个问题——从「你希望邀请谁共进晚餐」这种轻松的开场，一步步走到「你最害怕失去什么」「你最后悔没说出口的话是什么」。\n\n结果很动人：仅仅 45 分钟的共同作答，陌生人之间就长出了堪比数月友谊的亲密，有人甚至在实验后相爱。\n\n  这组「爱的 36 问」的秘密，不在于问了什么，而在于：它给了两个人一个安全的理由，把真心一点点交出去。\n\n我盯着这个结论想了很久。如果 36 个问题能让陌生人相爱，那它能不能，让两个早就在一起的人，重新认识一次？\n\n  三、于是，我把「灵魂之觅」递给了他\n\n它就是一个装着这 36 个问题的小程序。但我没跟他说「我们来做心理实验」，只是把邀请码发给了他：\n\n「无聊的话，陪我答一道题？」\n\n他回了个「好」。那天晚上九点，小程序轻轻提醒我们进入 安静时间 ——关掉别的，认真答一道。第一题是：「你最想邀请谁，共进一顿晚餐？」\n\n他写：「我姥爷。他走那年我不在身边。」\n\n我盯着这行字，忽然有点想哭。在一起三年，我第一次知道，他一直没放下这件事。\n\n 这是「灵魂之觅」最温柔的设计：你们答着同一组题，但只有两个人都答过同一道，才能互相看到答案。  于是那些平日里说不出口、怕被笑的话，借着题目的名义，自然地落到了对方面前。你不是在查岗，你们是在交换真心。\n\n  四、它不催你，它陪你「慢」\n\n别的 app 恨不得你一口气刷完。灵魂之觅反过来—— 36 道题，每天只为你解锁一道 。\n\n  题由浅入深，从「完美的一天是怎样的」，到「说三句以『我们』开头的话」，再到「分享一个私人问题，请对方给你建议」；\n  每晚九点后的 安静时间 ，像一句温柔的晚安：「今天也聊一句吧」；\n  它记着我们的 连续探索天数 ，像一盏小灯，陪我们一天天往下走。\n\n有一天突然聊卡住了，我点了一下「灵魂提问卡」，系统把下一道还没答的 36 问递了过去：「第 28 题：告诉对方，你喜欢他/她的什么，这次要非常诚实。」他愣了几秒，打了很长一段。我读到一半，把手机扣在胸口，笑了。\n\n那些话，他平时绝不会说。是题目，给了他一个开口的理由。\n\n  五、第 21 天，我们收到了一份「双人报告」\n\n答到第五道共同题时，小程序给我们算了一份 双人兼容报告 。不是「匹配度 87%」那种噱头，而是认认真真，把我们关系的质地摊开：\n\n  「你们在表达中用了许多相似的关键词，话题关注点高度重合。」\n  「当一方深入思考时，另一方也会给予同等深度的回应。」\n  「你们在积极与消极情绪的平衡上，非常一致。」\n\n它没说我们「天作之合」，也没说我们「不合适」。它只是让我看见： 原来我们一直这么同频，只是从前没机会摊开看。 \n\n后来我们还各自拿到了一张 情感 DN 谁\n\n第一次进来不用有压力。先随机答3道题，AI会给你一个初步的情感类型判定：连接型、探索型、表达型、守护型、创造型——你是哪一种灵魂，先有个轮廓。\n\n  3. 灵魂寻觅：契合星卡\n\n基于你的答题数据，为你寻觅契合的灵魂，生成一张「契合星卡」，能看到你们之间的共同契合点。合不合适，不看脸，看灵魂底色。\n\n  4. 双人配对：答案互看，有规则的那种\n\n生成一个邀请码，发给你想深度了解的那个人。TA加入后，两个人回答同一组36问。\n\n这里有个关键设计： 只有双方都答过同一道题，才能互相看到对方的答案。 你的回答永远不会单方面被看光，你们是同步走向彼此的。\n\n配对成功后，可以在小程序里直接聊天，还有一张「灵魂提问卡」——一键把下一道36问发给对方，把对话不断推向更深的地方。\n\n  ✦ 好的关系不是聊了多久，而是聊到了多深。\n\n  5. 情感DNA报告：你的灵魂画像\n\n答完题，会生成你的情感DNA报告：五大情感维度的雷达图，加上AI基于你全部回答的个性化分析，还能生成分享图。你是一个什么样的人，答案里写着。\n\n  6. 双人兼容性报告：不是星座，是数据\n\n两个人共同答过至少5道题之后，可以生成兼容性报告——不是按生日推的玄学，是基于双方真实回答算出来的契合度分析。你们在哪里同频，在哪里互补，哪里需要磨合，报告会告诉你。\n\n  7. 修心空间：一个人时也有去处\n\n不配对也没关系，它也可以是你一个人的角落：\n\n   今日心情 ：每天记一笔，看见自己情绪的走向\n   音频修炼 ：内心修炼的听书内容\n   心流沉静 ：舒缓音律，帮你安静下来\n   纪念日 ：重要日子不再错过\n\n  ✦ 慢一点，是这个产品最大的功能。\n\n  三、实话实说的部分\n\n丑话说在前面，这个小程序 不能帮你脱单 ，也不承诺「答完36问就能相爱」。它不替你制造感情，它只是把门推开——剩下的路，要你们自己走。\n\n它适合这些人：\n\n  暧昧期，想更进一步又不知从何聊起\n  老夫老妻，想重新认识一遍身边这个人\n  好朋友，想让这段关系走得更深\n  一个人的你，想借36问好好看看自己\n\n不适合的人也直说：想快速刷人、只想看脸配对的，这里没有你要的东西。\n\n  四、三步开始\n\n   第一步 ：微信搜索小程序「灵魂之觅」，或扫文末二维码\n   第二步 ：先做3分钟速测，拿到你的情感类型\n   第三步 ：想找个人一起——生成邀请码发给TA；想自己探索——直接开始每日一问\n\n今晚九点以后，是答题的最好时间。安静下来，认真答第一题。\n\n有些话，问了才有答案；有些人，问了才真正认识。\n\n  ✦ 36个问题之后，你们要么更近，要么更清楚。\n\n✦ 美好需要创造\n世界一隅 · WORLD CORNER\n2026.08.21\n", "mtime": 1787315407, "size": 4862}, {"path": "docs/公众号音频库上传.md", "title": "公众号音频库上传", "text": "  微信公众号音频库批量上传方案与素材清单\n\n  2026 08 23 · 公众号 gh bd189357a403(bizuin 3632308606)音频库\n  目标:《幸福的内在》有声书 31 条音频 + 31 张封面,全部入库成功。\n\n  一、上传原理(登录态接口,非官方 API)\n\n公众号后台上传音频需登录态 cookie,走「素材库 → 音频 → 新建」前端的一套 cgi bin 接口。官方 API 的音视频素材均有限秒(60s)限制,无法用于有声书,必须走登录态。\n\n全链路 6 步(均已实测打通):\n\n1.  封面 :官方 API  material/add material?type image  上传 jpg → 得到  mmbiz.qpic.cn  URL,直接作为 cover url(无需再走后台 cropimage)。\n2.  init : POST /cgi bin/audioupload?action init upload&token {t}  body {filename, filesha(整文件SHA1 hex), filesize}  →  {audio id, miss part num:[]} \n3.  分片 :每 1MB 一片, POST /cgi bin/audioupload?action upload block&part sha {片SHA1hex}&audio id {id}&part num {n}&token {t} ,body 分片字节, Content Type: application/octet stream \n4.  finish : POST /cgi bin/audioupload?action upload finish&audio id {id}&screen shot type undefined&token {t} (空 body)→ ret:0\n5.  create : POST /cgi bin/operate voice?oper create&token {t}&lang zh CN  body {audio id, title, desc, cover url}  →  {encode file id} \n6.  update(保存) : POST /cgi bin/operate voice?oper update&token {t}&lang zh CN  body {fileid: encode file id, title, cover url, check time:0, check last time:0}  → ret:0 \"保存成功\"\n\n  关键排错记录(踩坑)\n\n  错误码   根因  \n \n   200003 invalid session    Cookie 头未正确拼接(本地缓存为扁平 dict,正确写法  \"; \".join(f\"{k} {v}\" ...) ;且剔除  mp token  键)  \n   200040 invalid csrf token     URL 缺  &token 907701780 。该 token 与登录态绑定,除 upload block 外所有请求都要求;每次会话 cookie 更新后 token 可能变更  \n   220001/220002    素材库/图片库达上限(业务错误,未触发)  \n   200807    create 时缺封面(本次用官方 API 图 URL 成功,未触发)  \n\n  环境要求\n\n  请求头必须带:UA(与 cookie 来源浏览器一致)、Cookie、X Requested With、Referer https://mp.weixin.qq.com/cgi bin/filepage?type 3&... 。\n  分片大小   前端  uploadFileBlockSize    1MB; part num   Math.ceil(offset/1MB)+1 。\n  列表核实: GET /cgi bin/filepage?type 3&begin 0&count 50&token {t}&lang zh CN  返回 HTML,内嵌  wx.cgiData   {\"type\":3, \"file item\":[...]} (用大括号平衡扫描解析)。\n  工具脚本仅存于本地  /.claude/projects/I /local/mp audio uploader.py (含凭据读取逻辑),凭据不落仓库、不进对话。\n\n  二、素材清单(《幸福的内在》,31 条,file id 已核对入库)\n\n      标题   file id   音频   封面  \n \n  1   01 思想之光   100002819   01 思想之光.mp3   01 思想之光.jpg  \n  2   02 真知之路   100002823   02 真知之路.mp3   02 真知之路.jpg  \n  3   03 文明的阶梯   100002825   03 文明的阶梯.mp3   03 文明的阶梯.jpg  \n  4   04 精神之争   100002827   04 精神之争.mp3   04 精神之争.jpg  \n  5   05 摆擂   100002829   05 摆擂.mp3   05 摆擂.jpg  \n  6   06 三座山   100002831   06 三座山.mp3   06 三座山.jpg  \n  7   07 脱节时代   100002833   07 脱节时代.mp3   07 脱节时代.jpg  \n  8   08 大逃离   100002835   08 大逃离.mp3   08 大逃离.jpg  \n  9   09 集体觉醒   100002837   09 集体觉醒.mp3   09 集体觉醒.jpg  \n  10   10 历史夹缝   100002839   10 历史夹缝.mp3   10 历史夹缝.jpg  \n  11   11 我们的哥伦布   100002841   11 我们的哥伦布.mp3   11 我们的哥伦布.jpg  \n  12   12 内心基建 mcp  管理 MCP 服务器｜ /skills  管理技能｜ /hooks  管理钩子｜ /permissions  权限与预批准 \n ·  /agents  后台 Agent｜ /tasks  任务列表｜ /usage  用量统计 \n ·  /voice  语音输入｜ /schedule  云端例行任务｜ /config  配置中心 \n · 一个容易混的点：MCP 的 工具 是模型自动调用的，斜杠手动调的是 MCP  prompts ，格式如  /mcp__服务器__提示词  \n ✦ 金句：斜杠命令是效率开关，按场景记，比背全表有用。 \n\n 叁 · 快捷键与环境变量速记 \n ·  Shift+Enter  输入框换行｜ Ctrl+P  命令面板｜ Esc  中断当前操作 \n ·  Esc+Esc  回滚到检查点｜ Shift+Tab  切换权限模式｜ Ctrl+B  转后台｜ Ctrl+D  退出 \n · 常用环境变量： ANTHROPIC_API_KEY （API Key 认证）、 ANTHROPIC_BASE_URL （自定义网关）、 CLAUDE_CODE_MAX_TURNS （轮数上限）、 CLAUDE_CODE_SAFE_MODE （安全模式）、 DISABLE_UPDATES （禁止更新） \n ✦ 金句：快捷键是肌肉记忆，环境变量是给脚本用的。 \n\n 肆 · 三个直接能用的组合拳 \n 1）新项目起步 \n  /init  →  /status  →  /model ，先让 AI 读懂项目，再让它干活。 \n 2）无头自动任务（脚本/CI） \n  claude -p \"review this diff and list risks\" --output-format json ，一次跑完、结构化输出，方便接管道。 \n 3）长会话不卡死 \n  /context  看占用 →  /compact  只留关键决策 →  /usage  看花了多少。 \n ✦ 金句：会用组合拳，比背一百条命令更值。 \n\n 版本在快速迭代，命令有增也有删。会话里随时输入  /help  或按  Ctrl+P ，以你当前版本为准。 \n 关注公众号「美好需要创造」，闲鱼搜「AI编程踩坑清单」。 \n \n", "mtime": 1786866932, "size": 12909}, {"path": "docs/技术速查/GitHub_Orchestrate编排技能_中文说明.md", "title": "GitHub_Orchestrate编排技能_中文说明", "text": "  Orchestrate 编排技能 · 中文说明(中英对照要点)\n\n  英文原件: C:\\Users\\zhaot\\AppData\\Roaming\\com.github.githubapp\\app skills\\orchestrate\\SKILL.md (GitHub App 官方技能)\n  中文整理:2026 08 23。 技能核心是\"协调者模式\":把大任务拆成多个子会话并行干,再收拢结果。 \n  ⚠️ 使用注意:原技能依赖 GitHub App 特有的 MCP 工具(下表左列);在 Claude Code 中用右列等效能力执行。\n\n  1. 技能是什么(What it is)\n\n Orchestrate — 多会话 & 多仓库协调(multi session & multi repo coordination) \n\n不亲自把每件事干完,而是:派生一个或多个子会话,给每个完整任务,用消息持续引导,直到工作落地。子会话嵌套在创建者下面(侧边栏分组),可互相通信。\n\n 心智模型:一个会话 ≈ 一个分支 ≈ 一个 PR(one session ≈ one branch ≈ one PR)。 \n每个子会话负责一件自包含的工作,以独立 PR 落地。用这个 1:1 框架来划定每个会话的边界——自然成为独立 PR 的工作块,就该是独立会话。\n\n 用户显式调用 /orchestrate 时,默认委托(默认 delegate)。  已选择编排   你的职责是\"协调\",不是自己在当前会话里悄悄全干完(那违背目的)。动手前先宣布计划(几个会话、哪些仓库、各自干什么)。\n\n  2. 工具对照表(The toolbox — 中文 + 本环境等效)\n\n  GitHub App 原工具   用途   本环境(Claude Code)等效  \n \n   list projects    发现已配置项目及 project id   —(当前项目已知)  \n   create session    在任意项目派生子会话,kickoff.prompt 自动开工    Agent 工具 (给完整 prompt)  \n   open pr session  /  open issue session    在已有 PR/Issue 上开子会话   —(无直接等效)  \n   fork session    分支当前会话到新 worktree 探索备选方案    Agent fork (继承上下文)或 git 分支  \n   send session message    给另一个会话发消息(委派/给上下文/要结果)    SendMessage (发给 agent team 成员)  \n   respond to session plan    批准/驳回子会话的 plan(plan 模式暂停时)   —  \n   get session    查看子会话状态(分支/路径/diff 统计)   TaskList / TaskGet  \n   list sessions and chats    枚举现有会话,避免重复派生   TaskList  \n   navigate to    把 UI 切到某会话给用户看   —  \n   archive session    清理完成的子会话   TaskUpdate 标记完成  \n\n  create session 关键选项(本环境对应:Agent 参数的 prompt 要求)\n   kickoff.prompt(必填,最重要) :子会话从零开始, 看不到当前对话 。必须写完整、独立的任务书:目标 + 相关背景 + 完成定义(definition of done)。\n   kickoff.mode : plan (先出方案等批准)/  interactive  /  autopilot (明确执行工作默认 autopilot)。\n   coordinate with creator (默认 true):告诉子会话是谁创建的、怎么回报。独立 fire and forget 任务设 false。\n   base branch :堆叠 PR 的关键。默认新分支;要叠加在在途工作上时指定上层分支。\n\n  3. 核心工作流(Core workflow — 7 步)\n\n1.  工作 → 会话映射 :决定几个会话、各做什么。越少越好——每个仓库/PR 层/独立工作流一个。\n2.  解析项目 :找到每个会话对应的 project id。\n3.  宣布计划 :创建前先告诉用户要派几个、在哪、各干什么。\n4.  完整 kickoff 派活 :每个任务书必须独立自足。\n5.  选协调方式 :要结果回来用协调模式(回报 + 空闲通知);否则独立。\n6.  引导 :用 send session message 发后续修正/补充;需要子会话产出时,说明在等并结束本回合——等空闲通知,不要阻塞轮询。\n7.  收拢 :汇总结果、向用户总结、归档完成项。\n\n 绝不 sleep/轮询等子会话 。派完活就结束回合,空闲通知到了再继续。\n\n  4. 模式手册(Pattern playbooks)\n\n  多仓库改动(Multi repo change)\n  每个仓库一个会话,kickoff 描述该仓库的切片及整体关系(如\"SDK 暴露  fooBar() \" / \"应用消费  fooBar() \")。\n  B 依赖 A 的 API 时先做 A,或让 B 直接问 A 最终签名。\n  收集两者,确认对齐,总结。\n\n  跨仓库调研(Cross repo research)\n   跨仓库问题 → 在那个仓库派调研会话 (代码和历史在哪儿,调研就在哪儿跑)。\n   单仓库调研 → 当前会话内直接做 ,不派子会话、不硬套子代理。\n  调研结论落地:只为调研选出的\"具体用户可见工作\"建子会话(如具体要修的 bug)。\n\n  堆叠/依赖 PR(Stacked / dependent PRs)\n  层 1 正常创建;后续每层用  base branch  指向上层分支 → 每层 diff 只含本层增量。\n  每个会话开自己的 PR,堆栈小且可审。\n\n  并行扇出(Parallel fan out)\n  按任务数派 N 个独立会话,空闲通知收结果;不需要回报的设 coordinate with creator: false。\n  全部空闲后汇总。\n\n  探索备选方案(Explore an alternative)\n  fork session 复制当前历史到新 worktree/分支,在那边试;原会话不受影响。\n\n  批准或改向子会话的 plan(plan 模式)\n  子会话 plan 完成后会 暂停等人批准 ;暂停期间 send session message 只排队不执行。\n  协调者直接处理:get session 读 pending plan → respond to session plan 批准( approved: true )或驳回重计划( approved: false, feedback: \"...\" )。\n  协调者本身就是批准人,不用把每个批准都推给真人。\n\n  5. 最佳实践(Best practices)\n\n   每次 kickoff 都写完整上下文 ——子会话看不到本聊天,模糊的派活产生模糊的活。\n   先复用再派生 ——先查现有会话,不重复创建在途工作。\n   不过度编排 ——派生有开销,只拆真正受益于独立分支/仓库/并行的活。\n   要结果就选协调模式 (回报 + 空闲通知是收拢结果的循环)。\n   保持干净 ——完成的子会话归档,侧边栏保持可读。\n   ask user 只在主会话用于真正的范围阻塞 ,不用于可预期的等待状态。\n\n  6. 本环境落地建议(Claude Code)\n\n1. 复杂/跨模块任务:先用 Workflow(多代理编排脚本)或并行 Agent 实现 fan out。\n2. 每个子代理 prompt 写完整任务书(背景 + 目标 + 完成标准),对应 kickoff.prompt 要求。\n3. 子代理间通信用 SendMessage;结果回来用 TaskList/TaskGet 跟踪。\n4. 想探索备选方案用 fork 子代理或独立 git 分支,不动主线。\n", "mtime": 1787449486, "size": 6440}, {"path": "docs/技术速查/五大编程智能体速查.html", "title": "五大编程智能体速查", "text": " \n\n ✦ 实战 · AI 编程 \n\n 2026 年，终端里最热闹的战场，已经不是「哪家模型更强」，而是「哪个 AI 编程智能体更好用」。它们从「帮你补全代码」进化到「替你跑完整个项目」：读代码、改 bug、跑测试、提交 PR，一条龙。这篇文章把当下最火的五款—— Claude Code、OpenAI Codex、opencode、Reasonix、腾讯 CodeBuddy ——的安装、核心命令和脾气一次讲清。命令以各工具当前版本为准；进会话后先敲 /help 或按 Ctrl+P，永远是最准的答案。 \n\n \n 壹 · Claude Code —— 生态最全的「老大哥」 \n Anthropic 官方出品，终端原生，插件、技能、MCP 生态目前最成熟。 \n\n 启动与安装 \n • 启动： claude  ｜ 非交互： claude -p \"任务\"  \n • 继续上次： claude -c  ｜ 恢复指定会话： claude -r [ID]  \n\n 模型与诊断 \n • 选模型： claude --model opus|sonnet|fable （别名比全名好记） \n • 诊断： claude doctor  ｜ 升级： claude update  \n\n 高频斜杠 \n •  /init  初始化 ｜  /plan  出方案 ｜  /goal \"目标\"  达成即停 \n •  /commit  提交 ｜  /rewind  回滚 ｜  /code-review  审查 \n\n 上下文管理 \n •  /context  看占用 ｜  /compact  压缩 ｜  /usage  用量 ｜  /mcp  接服务 ｜  /skills  管技能 \n\n ✦ 金句：生态最全，深度用户的第一选择；命令记不住时，Ctrl+P 会帮你。 \n \n\n \n 贰 · OpenAI Codex —— 三端通吃的「官方派」 \n OpenAI 官方出品，终端 CLI、桌面 App、网页端（chatgpt.com/codex）三端覆盖，还提供 VS Code / Cursor / Windsurf 插件。 \n\n 安装与登录 \n • 安装： npm i -g @openai/codex  或  brew install --cask codex ；Windows 可用官方一键安装脚本 \n • 登录：ChatGPT 账号或 API Key，一次性配置后即可使用 \n\n 启动与三端 \n • 终端： codex  ｜ 桌面端： codex app  ｜ 网页端：chatgpt.com/codex \n • 桌面版支持技能（SKILL.md）、MCP、自动化任务和多任务并行 \n\n 非交互模式 \n • 一次性任务： codex exec \"修复这个竞态条件\" ，加  --json  输出结构化结果 \n • 恢复会话： codex resume  \n\n 会话内 \n •  /help  全部命令 ｜  /model  切模型 ｜  /status  看状态 \n\n ✦ 金句：CLI 当重武器、桌面端当日常驾驶舱，官方生态更新最快。 \n \n\n \n 叁 · opencode —— 多模型自由的「开源极客」 \n 开源项目，终端 TUI 起家，最大特点是 不绑死任何一家模型 ：Anthropic、OpenAI、各家开源模型都能接，还能跑无头服务器当 API 用。 \n\n 安装与启动 \n • 安装： npm i -g opencode-ai  ｜ 启动： opencode （TUI） \n\n 非交互模式 \n • 一次性任务： opencode run \"任务\"  \n • 常用搭配： --format json  结构化输出 ｜  -c  继续 ｜  --model 供应商/模型  选模型 ｜  --agent  选代理 \n\n 自定义与生态 \n • 专属 Agent： opencode agent create|list  \n • MCP： opencode mcp add|list  ｜ 全模型： opencode models  \n\n 无头部署 \n •  opencode serve  起 HTTP 服务 ｜  opencode web  起网页端 ｜  opencode stats  看用量 \n\n ✦ 金句：想自由换模型、或者把智能体当服务调，它就是最灵活的玩具。 \n \n\n \n 肆 · Reasonix —— DeepSeek 原生的「省钱派」 \n DeepSeek 生态的开源终端助手，主打 前缀缓存稳定、成本可控 ：默认用 Flash 模型跑日常迭代，需要时再临时升 Pro。 \n\n 启动 \n • 编程： npx reasonix code （首次粘贴 DeepSeek API Key） \n • 纯聊： reasonix chat  ｜ 一次任务： reasonix run \"任务\"  \n\n 模型切换 \n •  /pro  本轮升 Pro ｜  /preset fast|smart|max  调思考深度 \n •  Shift+Tab  切 review / AUTO / YOLO 权限 \n\n 项目与上下文 \n •  /init  生成 REASONIX.md ｜  /plan  先审后改 \n •  /compact  压缩上下文 ｜  /stats  看账单 \n\n 延伸 \n •  /skill new  写技能 ｜  /memory  持久记忆 ｜  /mcp  接服务 ｜  /qq connect  手机 QQ 继续聊 \n\n ✦ 金句：DeepSeek 用户的最优解：平时 Flash 省着花，关键一步再上 Pro。 \n \n\n \n 伍 · CodeBuddy —— 腾讯系的「全家桶」 \n 腾讯出品，终端 CLI、IDE 插件、独立 IDE「三位一体」，国内网络环境友好，和腾讯云生态打通。 \n\n 安装与启动 \n • 安装： npm i -g @tencent-ai/codebuddy-code  \n • 启动： codebuddy  ｜ 单次： codebuddy \"修复这个 bug\"  \n\n 常用参数 \n •  -p  非交互 ｜  -c  继续 ｜  -r  恢复 ｜  --model  切模型 ｜  --ide  连 IDE \n\n 会话内 \n •  /add-dir  加目录 ｜  /agents  管 Agent ｜  /clear  清上下文 ｜  /compact  压缩 \n •  /config  配置 ｜  /cost  看花费 ｜  /export  导出 \n\n 子命令 \n •  config  配置 ｜  mcp  MCP ｜  doctor  诊断 ｜  update  更新 \n\n ✦ 金句：腾讯云用户、国内网络的省心之选，终端 IDE 一套班子。 \n \n\n \n 六 · 一句话选型 \n 重度、深度使用 → Claude Code；想要官方三端+自动化 → Codex；极客自由换模型 → opencode；DeepSeek 用户、想省钱 → Reasonix；国内网络+腾讯生态 → CodeBuddy。 \n 不用纠结「哪个最好」——先装一个，跑通一个真实项目，比看十篇测评都管用。 \n ✦ 金句：工具各有脾气，顺手的那把才是好刀。 \n 关注公众号「美好需要创造」，闲鱼搜「AI编程踩坑清单」。 \n \n\n \n", "mtime": 1786866800, "size": 23730}, {"path": "docs/知识库/README.md", "title": "README", "text": "  📚 灵魂之觅 · 资料库\n\n  项目全部沉淀的总索引。Markdown 为源,SQLite FTS5 全文检索,网页版检索树见  docs/知识库/index.html 。\n  本体系借鉴 hermes agent 的 LLM Wiki 思想(Markdown 为源 + 互链 + 可重建索引)。\n\n  📋 公众号文章(主类) — 发布记录\n\n  运营公众号「美好需要创造」(深藏青+金品牌,排版 V4 见 wechat cover brand 相关记忆)。 公众号文章是主类,内部按产品/用途分四个副类 ,目录  docs/公众号文章/{产品}/ 。\n\n  副类一:灵魂之觅( docs/公众号文章/灵魂之觅/ )\n\n  文件   日期   状态  \n \n   灵魂之觅推广文 20260821.md    08 21   🏆  当前主推·源文 (\"36个问题,一个著名的心理学实验\")  \n   公众号推广文章 36个问题看见一个人的灵魂.html    08 21   🏆  当前主推·排版版 (与主推源文同篇)  \n   公众号推广文章.md  /  .html    08 13   详尽版(最早);⚠️ md 与 html 标题不同步,疑似两套演进  \n   公众号推广文章 情感版.md  /  .html    08 16   情感版(源文+排版)  \n   公众号推广文章 我们睡在同一张床却很久没好好聊过天了.html    08 18   睡床故事版排版(从情感版演化,标题已换)  \n   公众号推广文章 36问 深夜版.html    08 17   深夜场景版  \n   灵魂之觅 广告视频脚本.md    08 19   视频脚本  \n   灵魂之觅 36问 广告视频 投放.mp4  /  v2  /  v3    08 19   🏆 投放用 v2/v3,v1 为历史版  \n\n  副类二:天兵助手( docs/公众号文章/天兵助手/ )— ⚠️ 原「内心的修炼」改名\n\n  文件   说明  \n \n   公众号推广文章 天兵助手全指南.html    当前产品名版本(九关修炼 × 80+ 项数字资产)  \n   公众号推广文章 内心的修炼全指南.html     旧名版本 (改名前的,保留存档)  \n\n  副类三:Copilot 桌面版中文汉化( docs/公众号文章/Copilot汉化/ )\n\n  文件   说明  \n \n   公众号推广文章 Copilot桌面版中文汉化.md  /  .html    源文 + 排版版  \n   多平台 Copilot桌面版中文汉化.md    标题优化版(\"别等官方汉化了:三步今晚装好\")  \n   多平台 X动态 Copilot桌面版中文汉化.md    X 平台短版  \n\n  副类四:模板( docs/公众号文章/模板/ )\n   涨粉短帖 模板版.md  /  .html  — \"AI最强的是,你会问\"通用涨粉模板,复用价值高\n\n  🗂 技术与资讯\n\n  类别   文件  \n \n  技术速查( docs/技术速查/ )    Claude Code命令速查.html 、 五大编程智能体速查.html 、 GitHub Orchestrate编排技能 中文说明.md (GitHub App 官方编排技能,含本环境等效工具对照)  \n  AI 资讯( docs/AI资讯/ )    AI免费午餐真相.html 、 AI半月动态速览.html   \n  架构审查( docs/ )    backend architecture review 2026 08 21.md   \n  公众号音频库( docs/ )    公众号音频库上传.md (登录态音频上传协议 + 《幸福的内在》31 条 file id 清单)  \n  记录( docs/记录/ )    对话摘要 公众号技能与五合一文章 20260816.md (过程记录)  \n  抓取存档( docs/fetched/ )   外链抓取原始存档(不入检索)  \n\n  🗂 系统资产(不入检索,但常被引用)\n\n  资产   位置   说明  \n \n  项目长期记忆    .workbuddy/memory/ME     el.style.paddingLeft = (8 + depth*14) + 'px';
    const cnt = d.files.length + Object.keys(d.dirs).length;
    el.innerHTML = `<span class="arrow">${open?'▼':'▶'}</span>${name} <span class="count">${cnt}</span>`;
    const sub = document.createElement('div');
    if (!open) sub.style.display = 'none';
    el.onclick = () => { openDirs.has(id) ? openDirs.delete(id) : openDirs.add(id); rebuildTree(); };
    renderTree(sub, d, depth+1, p);
    container.appendChild(el); container.appendChild(sub);
  }
  node.files.forEach(f => {
    const el = document.createElement('div');
    el.className = 'node file';
    el.style.paddingLeft = (24 + depth*14) + 'px';
    el.textContent = '📄 ' + f.title;
    el.onclick = () => showFile(f, el);
    container.appendChild(el);
  });
}
function rebuildTree() { tree.innerHTML=''; renderTree(tree, root, 0, 'docs'); }

// ---- 文档显示 ----
let currentMark = null;
function showFile(f, el) {
  document.querySelectorAll('.file.active').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');
  let body = f.text;
  if (currentMark) {
    body = body.split(currentMark).join('<mark>' + currentMark + '</mark>');
  }
  content.innerHTML = `<h2>${esc(f.title)}</h2>
    <div class="path">${esc(f.path)} · ${kb(f.size)} · ${new Date(f.mtime*1000).toLocaleDateString()}</div>
    <div class="body">${body}</div>`;
  content.scrollTop = 0;
}
function kb(n){ return n>1048576 ? (n/1048576).toFixed(1)+' MB' : n>1024 ? (n/1024).toFixed(1)+' KB' : n+' B'; }
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- 搜索 ----
const q = document.getElementById('q');
let timer = null;
q.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(doSearch, 200);
});
q.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
function doSearch() {
  const kw = q.value.trim().toLowerCase();
  currentMark = kw || null;
  if (!kw) { rebuildTree(); showHome(); return; }
  const hits = DATA.files.filter(f =>
    f.title.toLowerCase().includes(kw) || f.text.toLowerCase().includes(kw));
  tree.innerHTML = '';
  const box = document.createElement('div'); box.id = 'results';
  if (!hits.length) { box.innerHTML = '<div class="empty">无匹配结果</div>'; }
  hits.slice(0, 100).forEach(f => {
    const el = document.createElement('div');
    el.className = 'res';
    let s = '';
    const idx = f.text.toLowerCase().indexOf(kw);
    if (idx >= 0) {
      const st = Math.max(0, idx-40);
      s = '…' + esc(f.text.slice(st, idx+80)) + '…';
      s = s.split(esc(kw)).join('<mark>'+esc(kw)+'</mark>');
    }
    el.innerHTML = `<div class="t">${esc(f.title)}</div><div class="p">${esc(f.path)}</div><div class="s">${s}</div>`;
    el.onclick = () => showFile(f, null);
    box.appendChild(el);
  });
  tree.appendChild(box);
}
function showHome() {
  content.innerHTML = `<h2>📚 知识库</h2>
    <div class="path">docs/知识库/index.html</div>
    <div class="body">共 ${DATA.files.length} 篇文档。
在左侧浏览目录,或输入关键词全文检索(FTS5 语义 + 关键词)。
文档源:docs/ 目录。索引由 scripts/kb_index.py 定期重建。</div>`;
}

rebuildTree();
showHome();
</script>
</body>
</html>
