  - id: wenming
    title: 文明的阶梯
    tracks: "7 篇"
    vol: "连播 39分"
    cover: /audio/cover-civilization.jpg
    src: /audio/civilization.mp3
    read_href: "/read/civilization/"
    desc: 从「喂饱」讲起的文明观:食物的解放带来时间,时间带来思考与文明。外部已被喂饱,内心开始饿——下一场跃迁,在精神喂养。幸福就是升级;灯塔是唯一能做的事。序言、五篇论证、每日必修、跋与续篇,一书立纲。续篇专讲算法时代:不种庄稼,就长野草。
    sukua:
      lead: 文明的每一次跃迁,都从「喂饱」开始;幸福与文明升级,是同一件事。
      intro: |
        《文明的阶梯》是这一切的纲领。它先论证:文明的每一次真正跃迁,都是一场「喂养革命」——从喂饱身体,到喂饱内心;
        再立判断:幸福就是需求被满足的体验,一群人的幸福,就是文明的升级;
        最后点明:当代人缺的不是善,是方向,我们唯一能做的,是把灯塔点亮。
        序言、五篇论证、每日必修、跋与续篇,从理论到「每天可做的四件事」,知行合一。
      points:
        - {n: "序言", t: "安静坐五分钟都难受?一个时代的人同时发慌,不是你的错,是文明走到某级台阶的必然。外部已被喂饱,下一场饥饿在内心。", q: "一灯照己,万灯照海——我们,台阶上见。"}
        - {n: "第一篇 喂饱", t: "文明的每一级跃迁,都从「喂饱」开始:食物→剩余→时间→思考→分工→文字→城市→文明。工具是延伸,喂养才是发动机。下一场饥饿,在别的地方。", q: "先把自己喂饱,再谈别的。身体是文明的硬件。"}
        - {n: "第二篇 人不止一层饿", t: "身体喂饱了,饥饿升到更高层:心智的饿、联结的饿、意义的饿。刷视频是喝盐水,越喝越渴——算法喂的是没有营养的假食物。下一场跃迁,是把思想、意义、联结变成人人能得的「口粮」。", q: "你刷两个小时,是喝盐水;认真读十分钟,才是吃饭。"}
        - {n: "第三篇 幸福就是升级", t: "幸福=需求被满足的体验;升级=让更大范围的人、更高层的需求被满足。同一件事,个人尺度叫幸福,群体尺度叫文明。", q: "看清自己饿在哪一层,就是幸福的起点。"}
        - {n: "第四篇 灯塔", t: "一个人的幸福,锁在人群里。但解法不是「利他」——这个词已被商业污染。当代人缺的不是善,是方向。我们唯一能做的,是把灯塔点亮。", q: "你不需要说服任何人,你只需要亮着。"}
        - {n: "第五篇 每日必修", t: "四篇论证,化成一天四件事:晨起喂身体,定刻喂思想,随时觉察心,夜来传灯。文明的阶梯,是靠每天重复的小事爬上去的。", q: "晨起,喂身体;定刻,喂思想;随时,觉察心;夜来,传灯。"}
        - {n: "跋", t: "从一顿饭讲起,绕一大圈,只说一件小事:你心里那点空,不是你的错,它有一个方向。文明的阶梯,从来不是一个人爬的。", q: "一灯照己,万灯照海。我们,台阶上见。"}
        - {n: "续篇", t: "心里那片地,不种庄稼,就会长野草。刷不完的短视频,不是你不自律——是有人在争夺你的认知能量。科技跑在了思想前面;给地留白,每天一段静思,把思想补到科技前面。", q: "先把你的那盏灯,从算法手里拿回来。"}
