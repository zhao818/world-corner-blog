  - id: xiangjian
    title: 走向田间
    tracks: "14 篇"
    vol: "连播 1小时15分"
    cover: /audio/cover-xiangjian.jpg
    src: /audio/xiangjian.mp3
    read_href: "/read/xiangjian/"
    desc: "「灵魂之觅」第四本,从前三本的「人」转向「器」:科技(AI)的试金石不在它多聪明,而在它服务谁。五幕衰败弧从土地讲到全荒,三把尺(康德/黑格尔/卢梭)量出文明走势,最后落到《农业圣典》的健康链——把目光,从收割,转回喂养。"
    sukua:
      lead: 科技该服务谁?看它站在收割这一边,还是喂养这一边。
      intro: |
        《走向田间》是「灵魂之觅」的第四本。前三本讲「人」——看清方向、看见问题、学会方法;这一本讲「器」:当科技(AI)成为时代的主语,它该服务谁、走向哪里。
        上卷从五幕衰败弧看「发生了什么」:乡土的无我、丰盈的觉醒、离土的虚无、房土的强撑、全荒的崩塌,两扇门(海子之死/许家印事业崩塌)划出时代的转折;
        下卷回答「怎么办」:扬弃三连问、卢梭之尺、维特根斯坦与希尔伯特的出口逻辑,最后落到《农业圣典》的健康链——健康的土壤、健康的植物、健康的动物、健康的人。
        核心动作是「曲线调焦」:书不提供方案,只把注意力这根镜头,从金钱和权力上,慢慢转回土地。
        三把尺,三种用法:康德照矛盾、黑格尔解矛盾、卢梭量对错——出口在维特根斯坦与希尔伯特,一个点灯,一个提问。
      points:
        - {n: "开卷", t: "这本书不做什么:不否定城市、不否定科技、不当作历史定论。它只问一个问题——当文明越来越擅长生产财富,却越来越难让人感到「够了」,是不是该重新看一眼土地?", q: "关注点在哪里,文明就在哪里。"}
        - {n: "序言", t: "2026 年夏三件小事:一部「烂片」《牛来》爆火、一场慈善崩塌、一摊相声混战。多因的事,只取一根线索,当三个「感受样本」来读——一个时代的现象,是内心荒芜到一定程度的对应。我们爱上「烂」,是因为认出了自己。", q: "我们,就是那头站不起来的小牛。"}
        - {n: "壹 二律背反", t: "康德借壳:每个时代的光明都有代价。农业、工业、互联网、AI,好与坏长在同一根藤上。看时代不看成绩单,看连带成本。", q: "这道光,它的影子落在哪?"}
        - {n: "贰 五幕衰败弧", t: "从集体时代到今天,五幕:乡土、丰盈、离土、房土、全荒。这是一则寓言,不是年表——海子之死(1989)、许家印事业崩塌(2023),是公众记忆里的两个符号,用来为这条弧划界。", q: "在我们这套叙事的观察里,土地是怎么丢的,人心往往也会出现相似的荒芜。"}
        - {n: "叁 丰盈的年代", t: "分田到户,人开始有「我」。李小龙、少林寺、金庸、琼瑶——英雄、爱情与梦想,从地里长出来。海子带着四本书走了:信仰、自然、远方,和人心深处的光。", q: "土地的丰盈,养出了内心的丰盈。"}
        - {n: "肆 空心与虚无", t: "离土进城,安全感从土地换成现金。叔本华的钟摆:欲望没有顶,痛苦与无聊之间,人心开始悬空。偶像工业和《还珠格格》,都是欲望的代糖。", q: "离土没有错。丢下的不是土地,是那颗「够得着就安心」的心。"}
        - {n: "伍 房子成土地", t: "房子成了新土地,房产证是新地契。权力意志的强撑:哪吒喊「我命由我不由天」,喊得最响的时代,恰恰是最不自由的时代。", q: "真正的超人,不需要喊。"}
        - {n: "陆 全荒", t: "慈善崩塌于见证,相声崩塌于笑声。不夸《牛来》,当镜子照——多数人是来猎奇的,少数人认出了自己。李佳琦的「工资涨没涨」,是文明下跌会慢慢长出来的样子。", q: "你挣着普通人的钱,到头来嘲讽普通人贫穷。"}
        - {n: "柒 不安全感", t: "引擎不是贪婪,是怕。人越挤越不安,崩在哪一级取决于文明。战争不是文明的属性,是文明还没治好的病。耶稣之死,是善的代价最重的一次证明。", q: "一个时代善需要付出多大代价才有人肯信,信用就裂了多深。"}
        - {n: "捌 扬弃", t: "取好、定边界、定方向。收割与喂养的分界,在是否透支再生产能力。撑起边界的,是法律之下更软的信仰、民风民俗、互助文化。", q: "一边拿走你的钱,一边告诉你,这是在帮你。"}
        - {n: "玖 判断的尺子", t: "卢梭:走出城市去乡村看看。看土地、看人口——地是被喂着的还是被抽干的,人口是均匀分布还是涌向一城。尺子收下,归因放下。", q: "土地,是比语言诚实一万倍的东西。"}
        - {n: "拾 好问题", t: "维特根斯坦:最要紧的东西恰恰说不出来,把灯点着,说不出来的东西自己会说话。希尔伯特:一门学科还有问题就是活的。", q: "只要这些问题还被人问着,这片地就还没死。"}
        - {n: "拾壹 回到原点", t: "《农业圣典》健康链:健康的土壤、植物、动物、人。愿意生,是因为有希望——希望本身就是文明。收割/喂养的定义与「什么不是收割」,是最后一块试金石。", q: "从收割,回到喂养。"}
        - {n: "跋", t: "把牛,从斗兽场,放回田里。心里那片地,不种庄稼,就长野草——把庄稼种下去,占住那个不再长草的位置。", q: "把目光,从收割,转回喂养。"}
