# 三书导读(总纲):为什么有这三本 / 各讲什么 / 适合什么人 / 先看哪本
guide:
  lead: 四本书,一条路
  intro: |
    这四本书,出自同一位作者,是一条完整的路——《文明的阶梯》是地图,告诉你文明往哪儿走、你往哪儿走;《幸福的内在》负责「看到」,《内心的修炼》负责「去修」;《走向田间》负责「转向」——技术时代,力量该引向哪。
    先看清方向,再看清今天的世界怎么了,学着安顿自己,最后把目光转向土地。一纲、一前、一后、一转,正好是一程完整的路。
    另有一篇《信任危机·前置条件论》,不在这条路上——它是独立的方法论沉淀,时代观察:辨利弊、避坑、借势,落到个体该怎么走。
  why: |
    **为什么有这四本书?** 它们原本各走各的路:《文明的阶梯》是新写的纲领——从「喂饱」讲起,论证文明的每一次跃迁都是喂养的升级,幸福与文明升级是同一件事;《幸福的内在》来自一套 31 期的音频节目,讲完了才发现它是一本完整的书;《内心的修炼》是一门「用书当拐杖」的人生通识课;《走向田间》是第四本——当科技(AI)成为时代的主语,它把前一本书立起的「方向」,落到「科技该服务谁」上,从收割转回喂养。四条轨迹,最终露出的却是同一根轴——面对「人为什么越来越空」这道题,一本立纲,一本把症状讲透,一本把药方递到手上,一本把力气引向土地。
  what: |
    **各讲的是什么?**
    《文明的阶梯》——**纲领与地图**,讲「方向」。序言、五篇论证、每日必修与跋:从「喂饱」立起文明的阶梯,到「人不止一层饿」看见下一场跃迁在内心,到「幸福就是升级」打通个人与群体,到「灯塔」点明我们唯一能做的,最后落到每天四件必修——喂身、喂脑、觉察心、传灯。一书立纲,知行合一。
    《幸福的内在》——**现象诊断书**,讲「看到」。从「物质已富,人为何更空」切入:先问为什么空(卡在历史夹缝、意义蒸发),再给怎么建(内心基建三根柱石:微小创造、深度关系、投入当下),最后追根(思想从哪来)。卷二端出十三个故事当证据,验证爱长什么样、幸福长什么样。
    《内心的修炼》——**修行操作书**,讲「去修」。九关体系:断舍离、立根本、炼心术、破执念、养身体、结善缘、明规则、明经济、立财基。身心社财四层推进,顺序本身就是修炼;每一关借一本经典当拐杖,把道理落成每天能上手的事。
    《走向田间》——**转向**,讲「喂养」。五幕衰败弧从土地讲到全荒,三把尺(康德照矛盾、黑格尔解矛盾、卢梭量对错)量出文明走势,最后落到《农业圣典》的健康链——科技该服务谁,看它站在收割这一边,还是喂养这一边。
  who: |
    **适合什么样的人?** 如果你想先把这一切串成一条线——为什么空、往哪走、每天做什么——先读《文明的阶梯》,它是地图,也是总纲。如果你正觉得空、焦虑、跟不上时代、说不清自己怎么了——再读《幸福的内在》,它会先把你「说中」,让你知道自己不是矫情。如果你已经不想只被理解,而是想真的动手修、愿意花时间按步骤建立内在秩序——那就走进《内心的修炼》,它给的是路径和方法。如果你已经走完这三步,想知道技术时代该把力量引向哪——那就走进《走向田间》,它把目光从收割,转回喂养。
  order: |
    **先看哪本?** 按一条线读:《文明的阶梯》定方向,《幸福的内在》看现象,《内心的修炼》去行动,《走向田间》转向喂养。阶梯讲清「为什么」,幸福内在讲清「看到」,内心修炼给出「去修」,走向田间把力气引向土地。四本也都各自完整:想先被理解,单读《幸福的内在》;想立刻上手方法,按目录跳到《内心的修炼》对应那一关;想直接看到科技时代的落点,先读《走向田间》也行——它承《文明的阶梯》的方向,是这四本里最新的那一本。

books:
  - id: xingfu
    title: 幸福的内在
    tracks: "31 篇"
    vol: "连播 2小时05分"
    cover: /audio/cover-happiness.jpg
    src: /audio/happiness.mp3
    read_href: "/read/happiness/"
    desc: 从「思想之光」到「升维」,31 篇散文小辑。适合睡前一刷、走路骑行、专注间隙给自己留一口气——它不催你,只陪你。
    sukua:
      lead: 幸福不是答案,是能力;不是终点,是路径。
      intro: |
        主书《幸福的内在》(01–18)从一个很当代的问题入手——物质已经这么富了,为什么人反而越来越空?
        它一层层拆:先问「为什么空」——我们卡在历史的夹缝里,奋斗的剧本失效了,旧的「意义地图」用不了了,人人被迫成为自己的哥伦布;
        再给「怎么建」——出路不是逃离,是向内做「内心基建」:在琐碎里找回微小的创造、经营深度关系、投入当下,用爱、真、美、使命去填内心的饥饿;
        最后追「根」——思想到底从哪来?书是桥、是镜子,不是源头,智慧的活水在自然、生活与实践里。
        番外《幸福的验证》(19–31)不再讲道理,端出 13 个故事当证据:《小王子》《夏洛的网》、天堂与地狱的长勺、卖火柴的小女孩、琼瑶的一生……
        它验证爱长什么样、幸福长什么样。结尾升维:把自己活成一个稳固的平面,再伸出那根线,与他人连成立体。
      points:
        - {n: "01 思想之光", t: "幸福在内在思想活动的果实里;思想要被说出来,才算真正活过。", q: ""}
        - {n: "02 真知之路", t: "思想要被检验。安宁、满足、温暖——幸福各有各的模样。", q: ""}
        - {n: "03 文明的阶梯", t: "物质是地基。先有生产力解放了人,人才有余力谈精神。", q: ""}
        - {n: "04 精神之争", t: "战场从物理搬到精神。文明每一级晋级,本质都是脱离本能绑架一步。", q: ""}
        - {n: "05 摆擂", t: "立起「脱离本能」的旗,向搞钱党、情爱党各路人马下了帖子,把话摆开讲。", q: ""}
        - {n: "06 三座山", t: "三道天命关卡:物欲的瘾、情爱的执、生死的畏——本能的设限,也是觉醒的考题。", q: ""}
        - {n: "07 脱节时代", t: "肉身还活在旧脚本里,科技却把外部世界冲进了新纪元。身心脱节,是这一代空虚的总根源。", q: ""}
        - {n: "08 大逃离", t: "越来越多人想逃——远方、过去、幻想、虚拟。根不在远方,在心里;逃得再远,空洞跟着走。", q: ""}
        - {n: "09 集体觉醒", t: "辞职信、奔赴乡村、人人拍视频、晚婚不婚——一代人对「写死的人生剧本」的集体出走。", q: ""}
        - {n: "10 历史夹缝", t: "奋斗降速,被释放的精力砸回内心成了空洞。慢不下来的焦虑、意义感的蒸发、越富越空的悖论。", q: "这真的不是矫情。这是时代,给整整一代人出的考题。"}
        - {n: "11 我们的哥伦布", t: "旧地图失效,被迫成为自己的哥伦布。两难:热闹地迷茫,还是清醒地孤独?", q: ""}
        - {n: "12 内心基建", t: "在内心这块领土上做国王、规划师、建造者。三根柱石:微小创造、深度关系、投入当下。", q: "这不是万能钥匙,更该叫「邀请」。"}
        - {n: "13 第四维度", t: "躲进屏幕的人:动漫、网文、游戏是新时代的童话。它是充电宝,还是麻醉剂?作者把问号递给你。", q: ""}
        - {n: "14 极好的一生", t: "维特根斯坦临终「我度过了极好的一生」;王阳明遗言「此心光明」。人生价值,藏着一把内在尺子。", q: ""}
        - {n: "15 精神主食", t: "心里空了拿什么填?爱——不只是浪漫,是联结。也不止这一条路:真、美、使命。", q: ""}
        - {n: "16 与自然对话·上", t: "书是桥、是镜子,不是源头。思想的土壤,是「胃的解放」加「夜的篝火」。", q: ""}
        - {n: "17 与自然对话·中", t: "智慧三步飞轮:与自然实践对话→阅读→实践整合。当代三大病,都是丢了自然底子、把书当源头。", q: ""}
        - {n: "18 与自然对话·下", t: "四个选择:重拾自然、优化阅读食谱、留思考空间、真诚交流。", q: "思想,是要被说出来的;幸福,是要与人分享的。"}
        - {n: "19 纯真之眼", t: "《小王子》《城南旧事》:孩童之眼剥掉世俗标签,去理解而非评判。", q: ""}
        - {n: "20 夏洛的网", t: "关系让意义诞生;价值在于为另一个生命创造了什么。", q: "你一直是我的朋友,这本身就是一件了不起的事。我为你织网,是因为我喜欢你。"}
        - {n: "21 天堂地狱", t: "同一口锅、同样的长勺,地狱喂自己、天堂喂对方。差别只有一样——心。", q: "利他,是把长勺变成幸福工具的开关。"}
        - {n: "22 小毛驴", t: "希梅内斯对驴不是怜悯是共鸣——「不是一头小毛驴,而是我本人」。外在风景即内心图景。", q: ""}
        - {n: "23 太阳下山", t: "「别在你怨恨的时候让太阳下山」;每句没说出口的对不起,都是一次微小的日落。", q: ""}
        - {n: "24 北国三章", t: "三根羽毛、姆明妈妈多切的一片面包、森林里生火的孩子——爱最深的表达,不是言语,是行动。", q: ""}
        - {n: "25 整把火柴", t: "四根火柴,四种渴望:火炉、烤鹅、圣诞树、奶奶。我们真正想要的,是那个愿意为之倾尽所有的「奶奶」。", q: "物质过剩的今天,火炉烤鹅圣诞树都有了,可内心的小女孩还赤着脚。"}
        - {n: "26 爱的四季", t: "春感受、夏探索、秋奉献、冬慈悲。四季都经历的人,才真正懂得爱。", q: ""}
        - {n: "27 误读", t: "琼瑶把缺父爱读成了爱情:需求的紧迫、认知的局限、时代的剧本。", q: "那是她的心灵在当时能找到的最优生存策略。"}
        - {n: "28 观察台", t: "欲望的风暴里,搭一个五瓦的观察台:微型正念、情绪标签、事后复盘。", q: ""}
        - {n: "29 成为自己", t: "最高的智慧是自知之明,最好的修行是成为自己。放下对完美爱情的执念。", q: ""}
        - {n: "30 两种悲痛", t: "失去自由、美化过去。悲痛是爱的反面回声——爱得越深,痛得越重。", q: ""}
        - {n: "31 升维", t: "物质一维 + 精神一维 = 稳固的平面;无数自洽的个体相连,成温暖立体的社会。", q: "幸福不是答案,是能力;不是终点,是路径。你心里的那盏灯,此刻,亮着吗?"}
