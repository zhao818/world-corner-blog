      title: "读完这一本,接下来读什么?"
      guide: '《幸福的内在》让我们看见了「人为什么空」。接下来这道题——怎么站上去?'
      items:
        - {name: "内心的修炼", pos: "修行操作书", url: "/read/neixin/", audio: "book-neixin", btn: "接着读"}
      order: ["《幸福的内在》·已读·看到问题", "《内心的修炼》→ 接下来·学方法", "《文明的阶梯》→ 最后·看清方向"]
  - id: neixin
    title: 内心的修炼
    tracks: "11 篇"
    vol: "连播 8小时"
    cover: https://6c69-linhunzhimi-d3gjq7hn146541f08-1391973557.tcb.qcloud.la/audiobook/cover-mind-practice-v2.jpg
    src: /audio/neixin/01.mp3
    read_href: "/read/neixin/"
    desc: 九关修炼体系——断舍离、立根本、炼心术、破执念、养身体、结善缘、明规则、明经济、立财基。每一关借一本书当拐杖:《沉思录》《传习录》《人生的智慧》…… 从序言听到完结篇,8 小时读完一门人生通识课。
    sukua:
      lead: 先学会不被世界定义,才有资格去拥有世界。
      intro: |
        一门「用书当拐杖」的人生通识课,和「灵魂之觅」小程序连动——36 问的情感 DNA 报告告诉你起点在哪,这本书告诉你下一步往哪走。
        身心社财四层推进,顺序本身就是修炼:先修心(心不稳的人,拥有越多,毁灭越快)——断舍离、立根本、炼心术、破执念、明规则;
        再养身(身体是心性的硬件)——养身体;后结缘(孤身一人,再强也撑不起生活)——结善缘;
        终立基(饿着肚子的人很难守住原则)——明经济、立财基。
        每一关借一本经典当拐杖:叔本华《人生的智慧》、马可·奥勒留《沉思录》、王阳明《传习录》、萨特、福柯、曼昆、《富爸爸穷爸爸》……
        读完相当于上了一门通识课。
      points:
        - {n: "序言", t: "情感 DNA 五种底色各对应一门功课;顺序本身就是修炼。", q: "先学会不被世界定义,才有资格去拥有世界。"}
        - {n: "断舍离", t: "叔本华《人生的智慧》:人的三重划分,外在只能加分不能造就幸福;性格即滤镜;财产是防波堤;地位是影子。", q: "评价是影子,不是本体。"}
        - {n: "立根本", t: "马可·奥勒留《沉思录》:控制二分法,不跟不可控的事较劲;内在城堡;以德为乐;向死而生。", q: "事物本身不伤害灵魂,只有我们对它的看法,才会扰乱内心。"}
        - {n: "炼心术", t: "王阳明《传习录》:心即理;知行合一,知而不行只是未知;致良知,人人心中有个圣人;事上磨练。", q: "最高级的修行,不在深山,在事上。"}
        - {n: "破执念", t: "萨特的存在主义:存在先于本质,人没有出厂设置;自由是判决;自欺;他人即地狱。", q: "人,是自己生命故事的作者,不是创伤的被动反应者。"}
        - {n: "养身体", t: "心性是软件,身体是硬件。睡眠→情绪→行动:品格一半是睡出来的;运动、饮食、自然。", q: "品格不是靠意志硬撑出来的,是靠一夜好觉养出来的。"}
        - {n: "结善缘", t: "信任是零钱,平时存得越多急用时越不缺;低信任环境人人交「防范税」;利他让善发生复利。", q: "好人缘不是讨好,是成为值得信任的人。"}
        - {n: "明规则", t: "福柯《规训与惩罚》:规训三技术——观察、文件化、考核;全景监狱,人自愿成为自己的监工。", q: "最深的控制,是让你以为从来没有人管过你。"}
        - {n: "明经济", t: "曼昆《经济学原理》:没有免费的午餐;机会成本;时间是最稀缺的资源;激励、边际、价格信号。", q: "看懂经济,是看懂每一个「选择背后的代价」。"}
        - {n: "立财基", t: "《富爸爸穷爸爸》:资产往兜里放钱,负债从兜里掏钱;现金流思维,让钱为你工作。", q: "先有现金流的自由,才有选择的自由。"}
        - {n: "完结篇", t: "九关走完,身心社财闭环——一个能安顿自己的完整的人立起来。", q: "这套体系不是让你变成圣人,是让你在真实世界里站得住。"}
