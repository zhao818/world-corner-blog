  - id: xinqian
    title: 信任危机·前置条件论
    tracks: "12 篇"
    vol: "连播 64分"
    cover: /audio/cover-xinqian.jpg
    src: /audio/xinqian.mp3
    read_href: "/read/xinqian/"
    desc: "「时代观察 · 方法论」,不并入四书主线:哲学没有绝对对错,只有时代前置条件是否匹配——前置条件成立,它就是事实描述;条件消失,它就是自言自语。用这套方法拆信任危机:辨利弊、避坑、借势,落到个体——对外萨特,对内列维纳斯。"
    sukua:
      lead: 哲学没有绝对对错,只有时代前置条件是否匹配。
      intro: |
        独立于四书主线的时代行动指南,从已有的书里长出来、也保持距离:承接《走向田间》用萨特「他人即地狱」照出的三场崩塌,把它们升维成方法论;与《算法争夺》互为镜——那篇讲注意力被收割,这篇讲信任被消费,同一片荒地,长的两种野草。
        全文做三件事,做完就收:辨利弊(旧信任贬值=新信任升值)、避坑(撞枪口地图·六坑)、借势(空窗期红利·五势)。哲学的天梯五问、前置条件论、自我反躬——哲学与时代背景的论证,最终都落回「人在这个时代该怎么走」。
      points:
        - {n: "01 开卷声明", t: "不是时代预测书,是时代行动指南。三件事做完就收:辨利弊、避坑、借势。", q: "把时代讲清楚,然后告诉你往哪站。"}
        - {n: "02 天梯五问", t: "新哲学=旧素材+新权重:看它换了什么主轴,再看能否自洽;第五问照自己。最高级的哲学,也带着出生时刻的印记。", q: "前置条件,决定一切。"}
        - {n: "03 前置条件论", t: "哲学没有绝对对错,只有时代前置条件是否匹配。现实是哲学的饲料,不是哲学的对象。", q: "喂得动的哲学活着,喂不动的就是自言自语。"}
        - {n: "04 反躬", t: "曾用休谟、哈丁、拜尔反驳信任危机——但那是解除期的理论,答危机期的题。苍白,是因为前置条件错位。", q: "我们用解除期的理论,去答危机期的题。"}
        - {n: "05 时代坐标", t: "五层地形图:亲密层到叙事层逐层侵蚀。破坏是洪水,不是狙击枪——无差别冲刷土壤,但站在岩床上的人只湿了脚。", q: ""}
        - {n: "06 时代的利弊", t: "旧信任贬值的地方,正是新信任升值的地方。利与弊不是两件事,是同一场危机的两面。", q: ""}
        - {n: "07 避坑", t: "六张坑:高调叙事、人设型信用、道德高地、大承诺、信息不对称高位、单点叙事。避坑不是躲起来,是换货币。", q: "撞枪口的人,手里还拿着上一时代的地契。"}
        - {n: "08 借势", t: "空窗期是信用资产重新定价:可验证性升值、真诚稀缺、平视沟通升值、小信任圈升值、核验者占位。", q: "在人人被打折的时代,做一个被查完还在的人。"}
        - {n: "09 未来推演", t: "修复的途径=押什么,崩溃的可能=防什么。旧信任回不去,新信任在路上——关键是把自己种在哪一侧。", q: ""}
        - {n: "10 落点", t: "不依赖「被信任」,只做「可信的事」。对外用萨特的尺子量世界,对内用列维纳斯的线守自己。", q: "可信是你立的标准,不是别人收割你的入口。"}
        - {n: "11 学术误区", t: "物极必反、抽象思辨、旁观者写作、无自反性分析。真正有价值的只有覆盖广度、破坏烈度、周期长短。", q: ""}
        - {n: "12 尾声", t: "好的一面,留给观众拼完。答案不在文章里,在成千上万条真实的生活里。", q: "读完的你,就是文章的后半篇。"}
