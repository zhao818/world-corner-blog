  - id: qunti
    title: 信任危机·群体侧观察
    tracks: "8 篇"
    vol: "连播 16分"
    cover: /audio/cover-qunti.jpg
    src: /audio/qunti.mp3
    read_href: "/posts/era-observation/2026-08-31-trust-crisis-group-side/"
    desc: "「时代观察」开篇,个体侧的群体镜像:个体讲『你怎么走』,这篇讲『时代在往哪走』。七个症状(机构塌/舆论翻/道德崩/原子散/落差大/没人动/信转人)、一套社会学索引(涂尔干×塔尔德×托克维尔)、五个坑——旧信任体系整体失灵,社会进入信用重铸期。不预测、不评判,只给一套观察框架。"
    sukua:
      lead: 个体在换货币,群体在等重铸。
      intro: |
        「时代观察」栏目的开篇,是《信任危机·前置条件论》的群体镜像:个体侧讲「人在时代里怎么走」,这篇讲「时代本身在往哪走」。
        全文做三件事:先看现象(七个症状)、再找结构(社会学索引)、后踩刹车(五个坑),最后落回个体——重铸期,我该做什么。
        它不预测、不评判,只给一套观察框架:把群体现象放进去,你就知道它们是什么、从哪来、会往哪去、你能做什么。
      points:
        - {n: "01 开篇与速览", t: "栏目定位:不追热点情绪,只给分析框架。现状:社会进入信用重铸期。总禁令:别把它读成末日预言。", q: "个体侧叫空窗期,群体侧叫重铸期——是同一扇窗的里外。"}
        - {n: "02 为什么写这篇", t: "个体侧讲完『你怎么走』,还剩一个没答的问题:整个时代处在什么状况?那些塌房爆雷反转,是一堆偶然,还是一种结构?", q: "框架是工具,不是结论。"}
        - {n: "03 七个症状·上", t: "机构信用破产(塔西佗陷阱)、舆论一天三反转、道德高地崩塌——先别全信、真相被生产、善意要自证。", q: "白纸黑字,分量变轻了。"}
        - {n: "04 七个症状·下", t: "人退回小屏幕、不是饿是凭什么(托克维尔期望落差)、没人敢先动(奥尔森集体行动)、信任从机构转到人(身份抱团)。口诀:机构塌,舆论翻,道德崩,原子散,落差大,没人动,信转人。", q: "在信不过整个社会的时候,先抱住自己的那伙人。"}
        - {n: "05 旧信任体系在失灵", t: "七个症状放进社会学索引,是同一场病变的不同侧面。公式:失范×舆论传染×期望落差三重叠加;底座物质,外显行动瘫痪与身份抱团,头顶悬着重建契约的呼求。", q: "重铸期里,舆论是最快的货币,人心是最贵的原料。"}
        - {n: "06 五个坑", t: "别用勒庞定性、别丢物质底座、别拿托克维尔当预测、盯住公意被假借、别读成末日预言。最险的坑:谁在趁重铸私印货币?谁来监督重建者?", q: "框架是观察镜,不是判官。"}
        - {n: "07 群体重铸个体做什么", t: "个体做可信的事不会自动聚合成共识——聚合发生在小信任圈:先在小结构里成筋,再被核验节点一根根焊起来。", q: "个体在换货币,群体在等重铸。"}
        - {n: "08 时代观察从这篇开始", t: "栏目节奏:目标每月一期,但有底线——宁可推迟,不可凑数。下期由读者出题:企业信任崩塌,还是舆论反转?", q: "宁可晚,不凑数。"}
