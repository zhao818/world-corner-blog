  slogan: 36 个问题,照见彼此,照见自己
  intro: 我们借一种古老的问答,把它搬进微信——两个人隔屏,依序回答 36 个由浅入深的问题,答案成对出现。它们照见的,不是谁与谁配对,而是各自的灵魂底色:你在哪一关缺课,就从哪一关开始修。36 问,是灵魂升级的第一级台阶。
  # 小程序码并排展示
  qrs:
    - name: 灵魂之觅
