# 灵魂之觅小程序推广页数据
app:
  name: 灵魂之觅
  slogan: 36 个问题,遇见对的人
  intro: 我们把哲学里的「柏拉图式爱情实验」搬进微信——两个人隔着屏幕,依序回答 36 个由浅入深的问题,答案成对出现,像两把钥匙对锁孔。
  # 小程序码图片(static/qr/)
  qr: /qr/linghunzhimi-code.jpg
  features:
    - icon: heart
      title: 36 问实验
      desc: 从「你梦想中的晚餐」到「最后一刻会打给谁」,36 问层层深入,答案匿名互见。
    - icon: users
      title: 智能配对
      desc: 依答案与你相似的灵魂会被推荐到眼前——不是看脸,是看你们答案的重合度。
    - icon: pen
      title: 匿名心语
      desc: 说不出口的话,写进心语屋。有人听,就有人回应,所有话都不必署名。
  findways:
    - 微信搜索小程序「灵魂之觅」
    - 扫朋友分享的小程序码
    - 从公众号菜单直达
