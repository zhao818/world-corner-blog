    - name: 内心的修炼
      tag: 身心社财 · 四层闭环
      desc: 九关修炼 · 灵魂测评 · 有声书 · 每日打卡
      qr: /qr/weiyu-code.jpg
  features:
    - icon: heart
      title: 36 问照见
