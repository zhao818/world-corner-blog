</a><script>
(function () {
  try {
    if (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/i.test(location.hostname)) return;
    var EP = 'https://api.worldcorner.xyz/community/api/pv';
    var sid = sessionStorage.getItem('wc_sid');
    if (!sid) {
      sid = (Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 24);
      sessionStorage.setItem('wc_sid', sid);
    }
    var p = new URLSearchParams(location.search);
    var src = p.get('from') || p.get('utm_source') || p.get('src') || '';
    var camp = p.get('utm_campaign') || p.get('ep') || p.get('camp') || '';
    if (src) sessionStorage.setItem('wc_src', src); else src = sessionStorage.getItem('wc_src') || '';
    if (camp) sessionStorage.setItem('wc_camp', camp); else camp = sessionStorage.getItem('wc_camp') || '';
    var refHost = '';
    if (document.referrer) {
      try {
        var rh = new URL(document.referrer).hostname.toLowerCase();
        if (rh && !/(^|\.)worldcorner\.xyz$/.test(rh)) refHost = rh;
      } catch (_) {}
    }
    var device = window.innerWidth <= 768 ? 'mobile' : 'desktop';
    var lang = (document.documentElement.getAttribute('lang') || 'zh').slice(0, 2) === 'en' ? 'en' : 'zh';
    var fired = {};
    function send(ev) {
      try {
        var body = JSON.stringify({
          path: location.pathname || '/',
          src: src,
          campaign: camp,
          ref_host: refHost,
          lang: lang,
          device: device,
          event: ev,
          sid: sid
        });
        if (navigator.sendBeacon && navigator.sendBeacon(EP, new Blob([body], { type: 'text/plain;charset=UTF-8' }))) return;
        fetch(EP, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: body, keepalive: true }).catch(function () {});
      } catch (_) {}
    }
    send('pv');
    document.addEventListener('play', function (e) {
      if (e.target && e.target.tagName === 'AUDIO' && !fired.audio) {
        fired.audio = 1;
        send('audio_play');
      }
    }, true);
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a') : null;
      if (!a || !a.href || fired.inner) return;
      try {
        var u = new URL(a.href, location.origin);
        if (u.pathname.indexOf('/inner/') !== -1) {
          fired.inner = 1;
          send('enter_inner');
        }
      } catch (_) {}
    }, true);
  } catch (_) {}
})();
</script>


<script>
    let menu = document.getElementById('menu')
    if (menu) {
        menu.scrollLeft = localStorage.getItem("menu-scroll-position");
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
