<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容管线 · 流程图</title>
<style>
  :root {
    --bg: #0a0a16;
    --card-bg: #16162e;
    --border: #2a2a4a;
    --text: #e8e6e3;
    --text-dim: #888;
    --gold: #c8a03c;
    --gold-dim: #8a6a20;
    --blue: #3a6ea5;
    --green: #27ae60;
    --red: #e74c3c;
    --purple: #8b5cf6;
    --pink: #ec4899;
    --orange: #f59e0b;
    --teal: #14b8a6;
    --stage1: rgba(245,158,11,.12);
    --stage2: rgba(200,160,60,.12);
    --stage3: rgba(58,110,165,.12);
    --stage4: rgba(139,92,246,.12);
    --stage5: rgba(20,184,166,.12);
    --stage6: rgba(236,72,153,.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: auto;
    min-height: 100vh;
    padding: 20px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px 16px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header h1 { font-size: 20px; color: var(--gold); font-weight: 700; letter-spacing: 1px; }
  .header h1 small { font-size: 12px; color: var(--text-dim); font-weight: 400; margin-left: 10px; }
  .header-controls { display: flex; gap: 8px; align-items: center; }
  .header-controls input {
    background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 6px; font-size: 12px; outline: none; width: 200px;
  }
  .header-controls input:focus { border-color: var(--gold); }
  .header-controls button {
    background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
    padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: .15s;
  }
  .header-controls button:hover { border-color: var(--gold); color: var(--gold); }

  /* ── Pipeline Layout ── */
  .pipeline {
    display: flex;
    gap: 16px;
    min-width: 1400px;
    padding: 10px 20px 40px;
    align-items: flex-start;
    position: relative;
  }

  .stage {
    flex: 1;
    min-width: 200px;
    max-width: 260px;
    position: relative;
  }

  .stage-header {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    text-align: center;
    border: 1px solid;
  }

  /* ── Arrows (CSS) ── */
  .stage::after {
    content: '▶';
    position: absolute;
    right: -12px;
    top: 30px;
    color: var(--text-dim);
    font-size: 12px;
    opacity: .4;
    z-index: 0;
  }
  .stage:last-child::after { display: none; }

  /* ── Cards ── */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all .2s;
    position: relative;
    z-index: 1;
  }
  .card:hover {
    border-color: var(--gold);
    transform: translateX(3px);
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }
  .card.active {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(200,160,60,.25);
  }
  .card .title {
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card .desc {
    font-size: 10.5px;
    color: var(--text-dim);
    line-height: 1.4;
    margin-top: 2px;
  }
  .card .badge {
    display: inline-block;
    font-size: 8.5px;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid;
    margin-top: 4px;
    font-weight: 500;
  }
  .badge-core { color: var(--gold); border-color: rgba(200,160,60,.3); background: rgba(200,160,60,.08); }
  .badge-py { color: var(--teal); border-color: rgba(20,184,166,.3); background: rgba(20,184,166,.08); }
  .badge-platform { color: var(--blue); border-color: rgba(58,110,165,.3); background: rgba(58,110,165,.08); }
  .badge-video { color: var(--pink); border-color: rgba(236,72,153,.3); background: rgba(236,72,153,.08); }
  .badge-data { color: var(--purple); border-color: rgba(139,92,246,.3); background: rgba(139,92,246,.08); }
  .badge-search { color: var(--orange); border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.08); }
  .badge-money { color: var(--green); border-color: rgba(39,174,96,.3); background: rgba(39,174,96,.08); }
  .badge-op { color: var(--red); border-color: rgba(231,76,60,.3); background: rgba(231,76,60,.08); }

  /* ── Branch indicator ── */
  .branch-line {
    position: absolute;
    left: -12px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border);
    opacity: .3;
  }
  .branch-label {
    position: absolute;
    left: -60px;
    top: 50%;
    transform: rotate(-90deg) translateX(-50%);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 2px;
    white-space: nowrap;
    text-transform: uppercase;
  }

  /* ── Column highlights ── */
  .stage-s1 .stage-header { border-color: var(--orange); color: var(--orange); background: var(--stage1); }
  .stage-s2 .stage-header { border-color: var(--gold); color: var(--gold); background: var(--stage2); }
  .stage-s3 .stage-header { border-color: var(--blue); color: var(--blue); background: var(--stage3); }
  .stage-s4 .stage-header { border-color: var(--purple); color: var(--purple); background: var(--stage4); }
  .stage-s5 .stage-header { border-color: var(--teal); color: var(--teal); background: var(--stage5); }
  .stage-s6 .stage-header { border-color: var(--pink); color: var(--pink); background: var(--stage6); }

  /* ── Sub pipeline (vertical) ── */
  .sub-pipeline {
    border-left: 2px dashed rgba(236,72,153,.2);
    margin-left: 8px;
    padding-left: 10px;
    margin-top: 4px;
  }
  .sub-pipeline .card { margin-bottom: 6px; }

  /* ── Detail modal ── */
  .modal-overlay {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.6);
    z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 520px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal h2 { color: var(--gold); font-size: 18px; margin-bottom: 4px; }
  .modal .close { float: right; background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 0 4px; }
  .modal .close:hover { color: var(--text); }
  .modal .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 12px; }
  .modal .sec { margin: 10px 0; }
  .modal .sec h3 { font-size: 13px; color: var(--gold-dim); margin-bottom: 3px; }
  .modal .sec h3::before { content: '▸ '; }
  .modal .sec p, .modal .sec li { font-size: 12.5px; line-height: 1.6; opacity: .9; }
  .modal .sec ul { padding-left: 16px; }
  .modal .flow { font-size: 12px; background: var(--bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); line-height: 1.6; white-space: pre-wrap; font-family: 'Cascadia Code', monospace; }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

// ─── 渲染 ───
function render() {
  const root = document.getElementById('pipeline');

  stages.forEach(stage => {
    const col = document.createElement('div');
    col.className = `stage ${stage.cls}`;

    const header = document.createElement('div');
    header.className = 'stage-header';
    header.textContent = stage.label;
    col.appendChild(header);

    // Count highlight cards
    let hasHighlight = false;

    stage.cards.forEach(c => {
      const card = document.createElement('div');
      card.className = 'card' + (c.highlight ? ' active' : '');
      card.id = 'card-' + c.id;
      card.innerHTML = `
        <div class="title">${c.title}</div>
        <div class="desc">${c.desc}</div>
        <span class="badge badge-${c.badge}">${c.badge}</span>
      `;
      card.onclick = () => showDetail(c.detail || { title: c.title, desc: c.desc });
      col.appendChild(card);
      if (c.highlight) hasHighlight = true;
    });

    root.appendChild(col);
  });
}

// ─── 详情弹窗 ───
function showDetail(d) {
  if (!d) return;
  const m = document.getElementById('modalContent');
  let html = `<button class="close" onclick="closeModal()">✕</button>`;
  html += `<h2>${d.title || ''}</h2>`;
  if (d.desc) html += `<div class="sub">${d.desc}</div>`;

  if (d.arch) html += `<div class="sec"><h3>架构</h3><div class="flow">${d.arch}</div></div>`;
  if (d.flow) html += `<div class="sec"><h3>数据流</h3><div class="flow">${d.flow}</div></div>`;

  if (d.files) {
    html += `<div class="sec"><h3>文件</h3><ul>`;
    (Array.isArray(d.files) ? d.files : [d.files]).forEach(f => html += `<li>${f}</li>`);
    html += `</ul></div>`;
  }

  if (d.pros) { html += `<div class="sec"><h3>✅ 优点</h3><ul>`; d.pros.forEach(p => html += `<li>${p}</li>`); html += `</ul></div>`; }
  if (d.cons) { html += `<div class="sec"><h3>⚠️ 缺点</h3><ul>`; d.cons.forEach(c => html += `<li>${c}</li>`); html += `</ul></div>`; }
  if (d.opt) { html += `<div class="sec"><h3>🔧 可优化</h3><ul>`; d.opt.split('|').forEach(o => html += `<li>${o.trim()}</li>`); html += `</ul></div>`; }

  document.getElementById('modal').classList.add('show');
  m.innerHTML = html;
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

// ─── 搜索 ───
function filterCards(q) {
  const lower = q.toLowerCase().trim();
  document.querySelectorAll('.card').forEach(el => {
    const text = el.textContent.toLowerCase();
    const match = !lower || text.includes(lower);
    el.style.display = match ? '' : 'none';
    if (match && lower) {
      // Highlight match in title
      const title = el.querySelector('.title');
      if (title) {
        const orig = title.textContent;
        const idx = orig.toLowerCase().indexOf(lower);
        if (idx >= 0) {
          title.innerHTML = orig.slice(0, idx) + '<mark style="background:rgba(200,160,60,.3);border-radius:2px;padding:0 2px;">' + orig.slice(idx, idx + lower.length) + '</mark>' + orig.slice(idx + lower.length);
        }
      }
    }
  });
}

// ─── 初始化 ───
document.addEventListener('DOMContentLoaded', render);
</script>
