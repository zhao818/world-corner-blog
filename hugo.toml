baseURL = 'https://worldcorner.xyz/'
languageCode = 'zh-cn'
title = '世界一隅'
theme = 'PaperMod'
enableRobotsTXT = true

# 多语言：中文为默认（根路径），英文挂 /en/（PaperMod 自带 zh/en 主题文案与右上切换器）
defaultContentLanguage = 'zh'

[security]
  allowContent = ['.*']

[markup.goldmark.renderer]
  unsafe = true

# ---- 沉浸式顶部导航（搜索 + 知识星图）----
[[menu.main]]
  name = "星图"
  url = "/graph/"
  weight = 90
  identifier = "menu-graph"

[[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 95
  identifier = "menu-search"

# ---- 双语言定义 ----
[languages]
  [languages.zh]
    languageName = '中文'
    languageCode = 'zh-cn'
    weight = 1
    title = '世界一隅'
    [languages.zh.params]
      description = '在算法洪流中，守护清醒的微光。'
      DateFormat = '2006年1月2日'

  [languages.en]
    languageName = 'English'
    languageCode = 'en-us'
    weight = 2
    title = 'World Corner'
    [languages.en.params]
      description = 'Guarding a flicker of clarity in the flood of algorithms.'
      DateFormat = 'Jan 2, 2006'
      [languages.en.params.label]
        text = 'World Corner'

  # 英文顶部菜单
  [[languages.en.menu.main]]
    name = "Graph"
    url = "/en/graph/"
    weight = 90
    identifier = "menu-graph"

  [[languages.en.menu.main]]
    name = "Search"
    url = "/en/search/"
    weight = 95
    identifier = "menu-search"

[params]
  env = 'production'
  ShowToc = true
  title = '世界一隅'
  description = '在算法洪流中，守护清醒的微光。'
  DateFormat = '2006年1月2日'
  author = 'Tianbing Zhao'
  defaultTheme = 'light'
  [params.label]
    text = '世界一隅'
    icon = '/images/mark.svg'
    iconHeight = 32

[outputs]
  home = ["HTML", "RSS", "JSON"]
